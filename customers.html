 2px;cursor:pointer}.customerNo{font-size:11px;color:#8a837c}.customerName{margin-top:2px;font-size:16px;font-weight:700}.customerKana,.customerMeta{font-size:12px;color:#77716a}.customerHeader{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.customerNumberBadge{white-space:nowrap;padding:5px 9px;border-radius:999px;background:#eee9e3;color:#665f58;font-size:12px;font-weight:700}.statGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:13px}.statBox{padding:11px 7px;border-radius:12px;background:#faf8f5;text-align:center}.statLabel{font-size:10px;color:#857e77}.statValue{margin-top:3px;font-size:14px;font-weight:700}.sectionDivider{border:0;border-top:1px solid #eee7df;margin:18px 0}.historyItem,.karteItem{padding:12px 0;border-bottom:1px solid #eee7df;line-height:1.6}.historyDate,.karteTitle{font-weight:700}.historySub,.kartePreview{font-size:12px;color:#77716a}.smallActions{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.smallActions button{width:auto;padding:8px 11px;border-radius:9px;margin-top:0}.badge{display:inline-block;margin-left:6px;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:700}.badgeDone{background:#e9f2e9;color:#47714d}.badgeNone{background:#f5ece8;color:#8b5d52}.foldSection{margin-top:18px;border:1px solid #e7e0d7;border-radius:14px;overflow:hidden;background:#fff}.foldSection>summary{position:relative;list-style:none;cursor:pointer;padding:14px 42px 14px 14px;background:#faf8f5;font-weight:700}.foldSection>summary::-webkit-details-marker{display:none}.foldSection>summary::after{content:'▼';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:11px}.foldSection[open]>summary::after{content:'▲'}.foldInner{padding:4px 14px 12px}.bodyChartBox{margin:12px 0;padding:12px;border:1px solid #e2dbd3;border-radius:14px;background:#faf8f5}.bodyChartBox .secondary{margin-top:0}.warningBox{padding:12px;border-radius:12px;background:#fff5ef;border:1px solid #ead3c4; <h1>整体なかの</h1><p class="muted">顧客・電子カルテ管理</p>
<section class="card" id="loginCard"><h2>管理者ログイン</h2><input id="email" type="email" placeholder="メールアドレス" autocomplete="email"><input id="password" type="password" placeholder="パスワード" autocomplete="current-password"><button class="primary" id="login">ログイン</button><div id="loginMsg" class="msg"></div></section>
<div id="app" class="hidden"><div class="topActions"><a href="./admin.html"><button class="secondary" type="button">予約管理へ戻る</button></a><button class="secondary" id="logout">ログアウト</button></div>
<div class="searchArea"><section class="card searchCard"><h2>顧客を探す</h2><input id="search" placeholder="名前・ふりがな・電話番号・顧客番号"><div id="kanaButtons" class="kanaButtons"></div><button class="primary" id="newCustomer" style="margin-top:12px">＋ 新しい顧客を登録</button><div id="customerCount" class="muted" style="margin-top:10px"></div><div id="customerList" class="customerList"></div></section></div>

<section class="card hidden" id="newCustomerCard"><h2>新しい顧客を登録</h2><label>ふりがな</label><input id="newKana"><label>お名前</label><input id="newName"><label>電話番号</label><input id="newPhone" inputmode="tel"><button class="primary" id="createCustomer">登録</button><button class="secondary" id="cancelNewCustomer">やめる</button><div id="newCustomerMsg" class="msg"></div></section>
<section class="card hidden" id="karteEditor"><h2 id="karteEditorTitle">施術記録</h2><label>来店日</label><input type="date" id="karteVisitDate"><div class="bodyChartBox"><button class="secondary" id="openEditorBodyChart" type="button">この日の身体図を開く・書き込む</button></div><h3>症状・お客様情報</h3><label>主訴</label><textarea id="karteChiefComplaint"></textarea><label>気になる部位</label><textarea id="kartePainfulAreas"></textarea><label>いつ頃から</label><input id="karteSince"><label>つらさ 0〜10</label><select id="kartePainLevel"><option value="">未入力</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select><label>既往歴</label><textarea id="karteMedicalHistory"></textarea><label>服薬</label><textarea id="karteMedications"></textarea><label>現在の通院・治療</label><textarea id="karteCurrentTreatment"></textarea><label>触れてほしくない部位・注意事項</label><textarea id="karteContraindications"></textarea><label>睡眠</label><textarea id="karteSleep"></textarea><label>生活習慣</label><textarea id="karteLifestyle"></textarea><label>お客様からの補足</label><textarea id="karteCustomerMessage"></textarea><hr class="sectionDivider"><h3>施術者記録</h3><label>所見</label><textarea id="karteFindings"></textarea><label>施術内容</label><textarea id="karteTreatment"></textarea><label>施術後の状態</label><textarea id="karteAfter"></textarea><label>次回方針</label><textarea id="karteNextPlan"></textarea><label>施術者メモ</label><textarea id="karteTherapistNote"></textarea><button class="primary" id="saveKarte">保存</button><button class="secondary" id="cancelKarte">やめる</button><button class="danger hidden" id="deleteKarte">この施術記録を削除</button><div id="karteMsg" class="msg"></div></section></div>

import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const supabase=createClient('https://scjzofjyxmchfjsngqtb.supabase.co','sb_publishable_EGlr-6w0xh4gD8OImboE_Q_V-COJ7t9'),$=id=>document.getElementById(id);let customers=[],selectedCustomer=null,currentBookings=[],currentKarte=[],editingKarte=null,currentKana='すべて';const kanaGroups=['すべて','あ','か','さ','た','な','は','ま','や','ら','わ','他'];
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');const phoneDigits=v=>String(v||'').replace(/\D/g,'');const todayJapan=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo'}).format(new Date());function kanaToHiragana(v){return String(v||'').trim().replace(/[\u30a1-\u30f6]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60))}function kanaGroup(v){const k=kanaToHiragana(v),f=k[0];if(!f)return'他';const g={あ:'あいうえおぁぃぅぇぉ',か:'かきくけこがぎぐげご',さ:'さしすせそざじずぜぞ',た:'たちつてとだぢづでどっ',な:'なにぬねの',は:'はひふへほばびぶべぼぱぴぷぺぽ',ま:'まみむめも',や:'やゆよゃゅょ',ら:'らりるれろ',わ:'わをんゎ'};for(const[a,c]of Object.entries(g))if(c.includes(f))return a;return'他'}const displayCustomerNo=c=>c?.customer_no_display?`顧客No.${c.customer_no_display}`:'';
function openBodyChart(date){if(!selectedCustomer)return;const u=new URL('./body-chart.html',location.href);u.searchParams.set('customer',selectedCustomer.id);u.searchParams.set('date',date||todayJapan());u.searchParams.set('name',selectedCustomer.customer_name||'');u.searchParams.set('_pagev',String(Date.now()));location.href=u.href}
async function syncAuth(){const{data:{session}}=await supabase.auth.getSession();$('loginCard').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);if(session)await loadCustomers()}$('login').onclick=async()=>{const{error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent='ログインできません。';return}$('loginMsg').textContent='';await syncAuth()};$('logout').onclick=async()=>{await supabase.auth.signOut();selectedCustomer=null;$('customerCard').classList.add('hidden');await syncAuth()};
function renderKanaButtons(){$('kanaButtons').innerHTML=kanaGroups.map(g=>`<button class="kanaBtn ${currentKana===g?'active':''}" data-group="${g}">${g}</button>`).join('');document.querySelectorAll('.kanaBtn').forEach(b=>b.onclick=()=>{currentKana=b.dataset.group;renderKanaButtons();renderCustomers()})}async function loadCustomers(){const{data,error}=await supabase.from('nakano_customers').select('*').eq('is_active',true);if(error)return;$('customerMsg').textContent='';customers=data||[];customers.sort((a,b)=>kanaToHiragana(a.customer_name_kana||a.customer_name).localeCompare(kanaToHiragana(b.customer_name_kana||b.customer_name),'ja'));renderKanaButtons();renderCustomers()}function renderCustomers(){const q=$('search').value.trim().toLowerCase(),f=customers.filter(c=>{const s=[c.customer_name,c.customer_name_kana,c.phone,c.phone_digits,c.customer_no,c.customer_no_display].filter(Boolean).join(' ').toLowerCase();return(!q||s.includes(q))&&(currentKana==='すべて'||kanaGroup(c.customer_name_kana||c.customer_name)===currentKana)});$('customerCount').textContent=`${f.length}人`;$('customerList').innerHTML=f.length?f.map(c=>`<div class="customerItem" data-id="${esc(c.id)}"><div class="customerNo">${esc(displayCustomerNo(c))}</div><div class="customerName">${esc(c.customer_name)}</div><div class="customerKana">${esc(c.customer_name_kana||'')}</div><div class="customerMeta">${esc(c.phone||'電話番号なし')}</div></div>`).join(''):'<span class="muted">該当するお客様はいません。</span>';document.querySelectorAll('.customerItem').forEach(x=>x.onclick=()=>openCustomer(x.dataset.id))}$('search').oninput=renderCustomers;
async function openCustomer(id){selectedCustomer=customers.find(x=>String(x.id)===String(id));if(!selectedCustomer)return;$('customerCard').classList.remove('hidden');$('newCustomerCard').classList.add('hidden');$('karteEditor').classList.add('hidden');fillCustomerForm();await Promise.all([loadBookingHistory(),loadKarte()]);$('customerCard').scrollIntoView({behavior:'smooth',block:'start'})}function fillCustomerForm(){const c=selectedCustomer;$('detailName').textContent=c.customer_name||'顧客情報';$('detailKana').textContent=c.customer_name_kana||'';$('detailNo').textContent=displayCustomerNo(c);$('editKana').value=c.customer_name_kana||'';$('editCustomerName').value=c.customer_name||'';$('editPhone').value=c.phone||'';$('editBirthDate').value=c.birth_date||'';$('editGender').value=c.gender||'';$('editEmail').value=c.email||'';$('editAddress').value=c.address||'';$('editCustomerNote').value=c.customer_note||c.memo||''}
$('saveCustomer').onclick=async()=>{if(!selectedCustomer)return;const name=$('editCustomerName').value.trim(),phone=$('editPhone').value.trim(),digits=phoneDigits(phone);if(!name||!digits){$('customerMsg').textContent='お名前と電話番号を入力してください。';return}const{data,error}=await supabase.from('nakano_customers').update({customer_name:name,customer_name_kana:$('editKana').value.trim()||null,phone,phone_digits:digits,birth_date:$('editBirthDate').value||null,gender:$('editGender').value||null,email:$('editEmail').value.trim()||null,address:$('editAddress').value.trim()||null,customer_note:$('editCustomerNote').value.trim()||null,updated_at:new Date().toISOString()}).eq('id',selectedCustomer.id).select().single();if(error){$('customerMsg').textContent='保存できませんでした。';return}selectedCustomer=data;$('customerMsg').textContent='顧客情報を保存しました。';await loadCustomers();selectedCustomer=customers.find(x=>x.id===data.id)||data;fillCustomerForm()};
$('newCustomer').onclick=()=>{$('newCustomerCard').classList.remove('hidden');$('customerCard').classList.add('hidden')};$('cancelNewCustomer').onclick=()=>$('newCustomerCard').classList.add('hidden');$('createCustomer').onclick=async()=>{const name=$('newName').value.trim(),phone=$('newPhone').value.trim();if(!name||!phoneDigits(phone)){ $('newCustomerMsg').textContent='お名前と電話番号を入力してください。';return}const{data,error}=await supabase.from('nakano_customers').insert({customer_name:name,customer_name_kana:$('newKana').value.trim()||null,phone,phone_digits:phoneDigits(phone),is_active:true}).select().single();if(error){$('newCustomerMsg').textContent='登録できませんでした。';return}await loadCustomers();$('newCustomerCard').classList.add('hidden');await openCustomer(data.id)};

function renderKarteList(){if(!currentKarte.length){$('karteList').innerHTML='<span class="muted">施術記録はありません。</span>';return}$('karteList').innerHTML=currentKarte.map(x=>`<div class="karteItem"><div class="karteTitle">${esc(x.visit_date)}${x.chief_complaint?`　${esc(x.chief_complaint)}`:''}</div><div class="kartePreview">${x.therapist_findings?`所見：${esc(x.therapist_findings)}`:''}${x.treatment_content?`<br>施術：${esc(x.treatment_content)}`:''}</div><div class="smallActions"><button class="secondary editKarte" data-id="${esc(x.id)}">開く・編集</button><button class="secondary bodyKarte" data-date="${esc(x.visit_date)}">身体図</button></div></div>`).join('');document.querySelectorAll('.editKarte').forEach(b=>b.onclick=()=>{const x=currentKarte.find(r=>String(r.id)===String(b.dataset.id));if(x)openKarteEditor(x)});document.querySelectorAll('.bodyKarte').forEach(b=>b.onclick=()=>openBodyChart(b.dataset.date))}

<!-- local navigation cache refresh -->
<script>
document.addEventListener('click',function(e){
  const a=e.target.closest?.('a[href]');
  if(!a)return;
  const raw=a.getAttribute('href')||'';
  if(!raw||raw.startsWith('#')||raw.startsWith('javascript:'))return;
  try{
    const u=new URL(a.href,location.href);
    if(u.origin===location.origin&&u.pathname.startsWith('/seitai-nakano-booking/')){
      u.searchParams.set('_v',String(Date.now()));
      a.href=u.href;
    }
  }catch{}
},true);
</script>
