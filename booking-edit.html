<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>整体なかの｜予約編集</title>
<style>
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:#f6f3ee;color:#2f2d2a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif}main{max-width:620px;margin:auto;padding:18px 11px 80px}h1{margin:0;font-size:24px}h2{margin:0 0 12px;font-size:19px}.muted{color:#77716a;font-size:13px;line-height:1.65}.hidden{display:none!important}.card{background:#fff;border:1px solid #e7e0d7;border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 5px 18px rgba(60,45,35,.035)}label{display:block;margin-top:12px;font-size:13px;font-weight:700}input,select,textarea,button{font:inherit;max-width:100%}input,select,textarea{display:block;width:100%;min-width:0;padding:13px;border:1px solid #e7e0d7;border-radius:12px;margin:6px 0 10px;background:#fff;color:#2f2d2a}input[type=date]{-webkit-appearance:none;appearance:none;height:48px}textarea{min-height:92px;resize:vertical}.primary,.secondary,.danger{width:100%;border-radius:13px;padding:13px;font-weight:700;margin-top:9px}.primary{background:#61574d;border:1px solid #61574d;color:#fff}.secondary{background:#fff;border:1px solid #ddd5cc;color:#49443f}.danger{background:#fff;border:1px solid #d8aaa5;color:#9b4138}button:disabled{opacity:.55}.msg{margin-top:9px;font-size:13px;line-height:1.65;color:#8a433b}.msg.ok{color:#277044}.summary{padding:13px;border-radius:13px;background:#faf8f5;line-height:1.7}.summary strong{font-size:17px}.topActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.topActions button{margin:0}.loginCard input{margin-top:8px}@media(max-width:420px){.topActions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>整体なかの</h1>
<p class="muted">予約編集</p>

<section id="loginCard" class="card loginCard hidden">
  <h2>管理者ログイン</h2>
  <p class="muted">予約を編集するには管理者ログインが必要です。</p>
  <input id="email" type="email" autocomplete="email" placeholder="メールアドレス">
  <input id="password" type="password" autocomplete="current-password" placeholder="パスワード">
  <button id="login" class="primary" type="button">ログイン</button>
  <div id="loginMsg" class="msg"></div>
</section>

<div id="editArea" class="hidden">
  <div class="topActions">
    <button id="backTop" class="secondary" type="button">← 管理トップへ戻る</button>
    <button id="reload" class="secondary" type="button">↻ 再読み込み</button>
  </div>

  <section class="card">
    <h2>予約内容を変更</h2>
    <div id="current" class="summary"><span class="muted">予約を読み込んでいます…</span></div>

    <label>予約日
      <input id="editDate" type="date">
    </label>

    <label>メニュー
      <select id="editMenu"><option value="">メニューを選択</option></select>
    </label>

    <label>開始時間
      <select id="editTime"><option value="">時間を選択</option></select>
    </label>

    <label>お客様名
      <input id="editName" autocomplete="name">
    </label>

    <label>電話番号
      <input id="editPhone" type="tel" inputmode="tel" autocomplete="tel">
    </label>

    <label>症状・メモ
      <textarea id="editMemo"></textarea>
    </label>

    <button id="save" class="primary" type="button">変更を保存</button>
    <button id="cancelBooking" class="danger" type="button">この予約をキャンセル</button>
    <div id="msg" class="msg"></div>
  </section>
</div>

<section id="errorCard" class="card hidden">
  <h2>予約を開けませんでした</h2>
  <div id="errorMsg" class="msg"></div>
  <button class="secondary" type="button" onclick="location.href='./admin.html?_v='+Date.now()">管理トップへ戻る</button>
</section>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://scjzofjyxmchfjsngqtb.supabase.co','sb_publishable_EGlr-6w0xh4gD8OImboE_Q_V-COJ7t9');
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const bookingId=params.get('id')||'';
let booking=null,menus=[];

function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function money(v){return Number(v||0).toLocaleString('ja-JP')+'円'}
function topUrl(){return './admin.html?_v='+Date.now()}
function showError(text){$('loginCard').classList.add('hidden');$('editArea').classList.add('hidden');$('errorCard').classList.remove('hidden');$('errorMsg').textContent=text}
function showLogin(){ $('editArea').classList.add('hidden');$('errorCard').classList.add('hidden');$('loginCard').classList.remove('hidden') }
function showEdit(){ $('loginCard').classList.add('hidden');$('errorCard').classList.add('hidden');$('editArea').classList.remove('hidden') }

async function getAvailableTimes(menuId,date){
  if(!menuId||!date)return[];
  const{data,error}=await supabase.rpc('nakano_available_slots',{p_date:date,p_menu_id:menuId});
  if(error){console.error(error);return[]}
  return data||[];
}

function renderCurrent(){
  if(!booking)return;
  const start=String(booking.start_time||'').slice(0,5);
  const mins=Number(booking.minutes)||30;
  $('current').innerHTML=`<strong>${esc(booking.booking_date)}　${esc(start)}</strong><br>${esc(booking.customer_name||'')} 様<br>${esc(booking.menu_name||'')}　${mins}分`;
}

async function loadMenus(){
  const{data,error}=await supabase.from('nakano_menus').select('id,name,price,minutes,is_active,display_order').order('display_order');
  if(error)throw error;
  menus=data||[];
  $('editMenu').innerHTML='<option value="">メニューを選択</option>'+menus.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}　${money(m.price)}${m.is_active===false?'（停止中）':''}</option>`).join('');
}

async function loadTimes(){
  if(!booking)return;
  const date=$('editDate').value,menuId=$('editMenu').value,box=$('editTime');
  box.disabled=true;
  box.innerHTML='<option value="">読み込んでいます…</option>';
  const rows=await getAvailableTimes(menuId,date);
  const current=String(booking.start_time||'');
  if(date===booking.booking_date&&String(menuId)===String(booking.menu_id)&&!rows.some(r=>String(r.start_time)===current))rows.push({start_time:current});
  rows.sort((a,b)=>String(a.start_time).localeCompare(String(b.start_time)));
  box.innerHTML='<option value="">時間を選択</option>';
  rows.forEach(r=>{const o=document.createElement('option');o.value=r.start_time;o.textContent=String(r.start_time).slice(0,5);if(date===booking.booking_date&&String(r.start_time)===current)o.selected=true;box.appendChild(o)});
  box.disabled=false;
}

async function loadBooking(){
  if(!bookingId){showError('予約IDがありません。今月の予約一覧から開き直してください。');return}
  const{data,error}=await supabase.from('nakano_bookings').select('*').eq('id',bookingId).single();
  if(error||!data){console.error(error);showError('予約情報を読み込めませんでした。');return}
  booking=data;
  if(booking.status!=='confirmed'){$('msg').textContent='この予約は現在「'+booking.status+'」です。';}
  await loadMenus();
  $('editDate').value=booking.booking_date||'';
  $('editMenu').value=booking.menu_id||'';
  $('editName').value=booking.customer_name||'';
  $('editPhone').value=booking.phone||'';
  $('editMemo').value=booking.memo||'';
  renderCurrent();
  await loadTimes();
  showEdit();
}

async function start(){
  const{data:{session}}=await supabase.auth.getSession();
  if(!session){showLogin();return}
  await loadBooking();
}

$('login').onclick=async()=>{
  $('login').disabled=true;$('loginMsg').textContent='';
  const{error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
  $('login').disabled=false;
  if(error){$('loginMsg').textContent='ログインできませんでした。';return}
  await loadBooking();
};

$('editDate').onchange=loadTimes;
$('editMenu').onchange=loadTimes;
$('reload').onclick=()=>location.reload();
$('backTop').onclick=()=>location.href=topUrl();

$('save').onclick=async()=>{
  if(!booking)return;
  const payload={
    p_booking_id:booking.id,
    p_date:$('editDate').value,
    p_start_time:$('editTime').value,
    p_menu_id:$('editMenu').value,
    p_customer_name:$('editName').value.trim(),
    p_phone:$('editPhone').value.trim(),
    p_memo:$('editMemo').value.trim()||null
  };
  if(!payload.p_date||!payload.p_start_time||!payload.p_menu_id||!payload.p_customer_name||!payload.p_phone){$('msg').className='msg';$('msg').textContent='日付・時間・メニュー・お名前・電話番号を確認してください。';return}
  $('save').disabled=true;$('msg').className='msg';$('msg').textContent='保存しています…';
  const{error}=await supabase.rpc('nakano_admin_change_booking',payload);
  $('save').disabled=false;
  if(error){console.error(error);$('msg').textContent='変更できませんでした。OPEN/CLOSE・予約不可・他の予約を確認してください。';await loadTimes();return}
  const{data:updated}=await supabase.from('nakano_bookings').select('*').eq('id',booking.id).single();
  if(updated)booking=updated;
  renderCurrent();
  $('msg').className='msg ok';$('msg').textContent='変更を保存しました。';
  await loadTimes();
};

$('cancelBooking').onclick=async()=>{
  if(!booking)return;
  if(!confirm(`${String(booking.start_time).slice(0,5)} ${booking.customer_name||''} 様の予約をキャンセルしますか？`))return;
  $('cancelBooking').disabled=true;$('msg').className='msg';$('msg').textContent='キャンセルしています…';
  const{error}=await supabase.rpc('nakano_admin_cancel_booking',{p_booking_id:booking.id});
  if(error){console.error(error);$('cancelBooking').disabled=false;$('msg').textContent='キャンセルできませんでした。';return}
  $('msg').className='msg ok';$('msg').textContent='予約をキャンセルしました。管理トップへ戻ります。';
  setTimeout(()=>location.href=topUrl(),500);
};

supabase.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||!session)showLogin()});
start();
</script>
</main>
</body>
</html>
