<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
  <title>整体なかの｜予約キャンセル</title>

  <style>
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      margin:0;
      background:#f6f3ee;
      color:#2f2d2a;
    }

    main{
      max-width:560px;
      margin:auto;
      padding:40px 14px 80px;
    }

    .card{
      background:#fff;
      border:1px solid #e7e0d7;
      border-radius:18px;
      padding:24px 18px;
      text-align:center;
    }

    h1{
      margin:0 0 18px;
      font-size:25px;
    }

    p{
      line-height:1.8;
    }

    button{
      width:100%;
      border:0;
      border-radius:12px;
      padding:16px;
      margin-top:18px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
    }

    #cancelBtn{
      background:#9b3b3b;
      color:white;
    }

    #cancelBtn:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .back{
      display:block;
      margin-top:22px;
      color:#555;
      text-decoration:none;
    }

    #message{
      margin-top:20px;
      font-weight:600;
    }
  </style>
<link rel="stylesheet" href="./customer-brand.css?v=20260815-2">
<script src="./customer-brand.js?v=20260815-2" defer></script>
<meta name="theme-color" content="#741b16">
</head>

<body>

<main>
  <div class="card">

    <h1>予約キャンセル</h1>

    <p id="description">
      この予約をキャンセルしますか？<br>
      キャンセル後は元に戻せません。
    </p>

    <button id="cancelBtn">
      予約をキャンセルする
    </button>

    <div id="message"></div>

    <a class="back" href="./index.html">
      予約ページへ戻る
    </a>

  </div>
</main>

<script type="module">

import {
  createClient
}
from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase=createClient(
  'https://scjzofjyxmchfjsngqtb.supabase.co',
  'sb_publishable_EGlr-6w0xh4gD8OImboE_Q_V-COJ7t9'
);

const params=new URLSearchParams(window.location.search);
const token=params.get('token');

const cancelBtn=document.getElementById('cancelBtn');
const message=document.getElementById('message');
const description=document.getElementById('description');

if(!token){

  cancelBtn.style.display='none';

  description.textContent=
    'キャンセル情報が見つかりません。';

}

cancelBtn.addEventListener('click',async()=>{

  if(!token) return;

  const confirmed=window.confirm(
    '本当にこの予約をキャンセルしますか？'
  );

  if(!confirmed) return;

  cancelBtn.disabled=true;
  cancelBtn.textContent='処理中...';
  message.textContent='';

  const {data,error}=await supabase.rpc(
    'nakano_cancel_booking',
    {
      p_token:token
    }
  );

  if(error){

    console.error(error);

    message.textContent=
      'キャンセル処理に失敗しました。';

    cancelBtn.disabled=false;
    cancelBtn.textContent='予約をキャンセルする';

    return;
  }

  if(data===true){

    description.textContent=
      '予約をキャンセルしました。';

    message.textContent=
      'キャンセルが完了しました。';

    cancelBtn.style.display='none';

  }else{

    description.textContent=
      'この予約はすでにキャンセルされているか、キャンセル情報が無効です。';

    cancelBtn.style.display='none';

  }

});

</script>


<!-- local navigation cache refresh -->
<script>
document.addEventListener('click',function(e){
  const a=e.target.closest?.('a[href]');
  if(!a)return;
  const raw=a.getAttribute('href')||'';
  if(!raw||raw.startsWith('#')||raw.startsWith('javascript:'))return;
  try{
    const u=new URL(a.href,location.href);
    if(u.origin===location.origin&&u.pathname.startsWith('/seitai-nakano-booking/')){
      u.searchParams.set('_v',String(Date.now()));
      a.href=u.href;
    }
  }catch{}
},true);
</script>
</body>
</html>
