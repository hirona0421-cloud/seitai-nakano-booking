<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>整体なかの｜管理</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;
  margin:0;
  background:#f6f3ee;
  color:#2f2d2a;
}

main{
  max-width:620px;
  margin:auto;
  padding:18px 14px 80px;
}

.card{
  background:#fff;
  border:1px solid #e7e0d7;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}

h1{
  margin:0;
  font-size:24px;
}

h2{
  font-size:19px;
  margin:0 0 10px;
}

.muted{
  color:#77716a;
  font-size:13px;
  line-height:1.6;
}

input,
select,
textarea{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  border:1px solid #e7e0d7;
  border-radius:12px;
  font:inherit;
  margin:6px 0 10px;
  background:#fff;
}

textarea{
  min-height:80px;
}

.primary,
.secondary,
.danger{
  width:100%;
  border-radius:13px;
  padding:13px;
  font-weight:700;
  font:inherit;
}

.primary{
  background:#61574d;
  color:#fff;
  border:0;
}

.secondary{
  background:#fff;
  border:1px solid #e7e0d7;
  margin-top:8px;
}

.danger{
  background:#fff;
  color:#9b4138;
  border:1px solid #d8aaa5;
  margin-top:8px;
}

.slots{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.slot{
  border:1px solid #e7e0d7;
  border-radius:12px;
  padding:12px 6px;
  font-weight:700;
}

.open{
  background:#eaf3ec;
}

.closed{
  background:#f4ece9;
  color:#8a7770;
}

.booking{
  padding:12px 0;
  border-bottom:1px solid #e7e0d7;
  line-height:1.5;
}

.booking:last-child{
  border-bottom:0;
}

.booking .danger{
  width:auto;
  padding:7px 12px;
  font-size:12px;
}

.hidden{
  display:none;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.msg{
  font-size:13px;
  line-height:1.5;
  margin-top:8px;
}
</style>
</head>

<body>
<main>

<h1>整体なかの</h1>
<p class="muted">店側 予約管理</p>

<section class="card" id="loginCard">

<h2>管理者ログイン</h2>

<input
  id="email"
  type="email"
  placeholder="メールアドレス"
>

<input
  id="password"
  type="password"
  placeholder="パスワード"
>

<button class="primary" id="login">
ログイン
</button>

<p id="loginMsg" class="muted"></p>

</section>


<div id="adminArea" class="hidden">


<section class="card">

<h2>管理日</h2>

<input
  type="date"
  id="date"
>

<button class="secondary" id="logout">
ログアウト
</button>

</section>


<section class="card">

<h2>空き枠 OPEN / CLOSE</h2>

<p class="muted">
OPENになっている時間だけ、お客様の予約候補になります。
</p>

<div class="row">

<button class="secondary" id="openAll">
この日を全部OPEN
</button>

<button class="secondary" id="closeAll">
この日を全部CLOSE
</button>

</div>

<div
  id="slots"
  class="slots"
  style="margin-top:10px"
></div>

</section>


<section class="card">

<h2>店側から予約を追加</h2>

<p class="muted">
電話・LINE・口頭で入った予約も、ここから同じ予約表に登録できます。
</p>

<select id="menu">
<option value="">メニューを選択</option>
</select>

<select id="adminTime">
<option value="">空き時間を選択</option>
</select>

<input
  id="customerName"
  placeholder="お客様名"
>

<input
  id="phone"
  inputmode="tel"
  placeholder="電話番号"
>

<textarea
  id="memo"
  placeholder="症状・メモ"
></textarea>

<button
  class="primary"
  id="addBooking"
>
予約を追加
</button>

<div
  id="addMsg"
  class="msg muted"
></div>

</section>


<section class="card">

<h2>予約一覧</h2>

<div
  id="bookings"
  class="muted"
></div>

</section>


</div>


<script type="module">

import {
  createClient
} from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


const supabase=createClient(
  'https://scjzofjyxmchfjsngqtb.supabase.co',
  'sb_publishable_EGlr-6w0xh4gD8OImboE_Q_V-COJ7t9'
);


const times=[];

for(let h=8;h<=22;h++){

  for(const m of [0,30]){

    if(!(h===22 && m===30)){

      times.push(
        `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00`
      );

    }

  }

}


let menus=[];


async function syncAuth(){

  const {
    data:{session}
  }=await supabase.auth.getSession();

  document
    .getElementById('loginCard')
    .classList
    .toggle('hidden',!!session);

  document
    .getElementById('adminArea')
    .classList
    .toggle('hidden',!session);

  if(session){

    const date=document.getElementById('date');

    if(!date.value){

      date.value=
        new Date()
        .toISOString()
        .slice(0,10);

    }

    await loadMenus();

    await load();

  }

}


document
.getElementById('login')
.onclick=async()=>{

  const email=
    document
    .getElementById('email')
    .value
    .trim();

  const password=
    document
    .getElementById('password')
    .value;

  const msg=
    document
    .getElementById('loginMsg');

  const {
    error
  }=
  await supabase.auth.signInWithPassword({
    email,
    password
  });

  if(error){

    msg.textContent=
      'ログインできません。入力内容を確認してください。';

    return;

  }

  msg.textContent='';

  syncAuth();

};


document
.getElementById('logout')
.onclick=async()=>{

  await supabase.auth.signOut();

  syncAuth();

};


document
.getElementById('date')
.onchange=load;


async function loadMenus(){

  const {
    data,
    error
  }=
  await supabase
    .from('nakano_menus')
    .select('*')
    .eq('is_active',true)
    .order('display_order');

  if(error){

    return;

  }

  menus=data||[];

  const select=
    document
    .getElementById('menu');

  select.innerHTML=
    '<option value="">メニューを選択</option>'
    +
    menus.map(
      m=>
      `<option value="${m.id}">
      ${m.name}　${Number(m.price).toLocaleString()}円
      </option>`
    ).join('');

}


document
.getElementById('menu')
.onchange=loadAdminTimes;


async function loadAdminTimes(){

  const menuId=
    document
    .getElementById('menu')
    .value;

  const date=
    document
    .getElementById('date')
    .value;

  const select=
    document
    .getElementById('adminTime');

  select.innerHTML=
    '<option value="">空き時間を選択</option>';

  if(!menuId || !date){

    return;

  }

  const {
    data,
    error
  }=
  await supabase.rpc(
    'nakano_available_slots',
    {
      p_date:date,
      p_menu_id:menuId
    }
  );

  if(error){

    document
    .getElementById('addMsg')
    .textContent=
      '空き時間を取得できません。';

    return;

  }

  (data||[]).forEach(
    slot=>{

      const option=
        document.createElement('option');

      option.value=
        slot.start_time;

      option.textContent=
        String(slot.start_time)
        .slice(0,5);

      select.appendChild(option);

    }
  );

}


async function setAll(open){

  const date=
    document
    .getElementById('date')
    .value;

  if(!date){

    return;

  }

  const rows=
    times.map(
      time=>({
        slot_date:date,
        start_time:time,
        is_open:open
      })
    );

  const {
    error
  }=
  await supabase
    .from('nakano_open_slots')
    .upsert(
      rows,
      {
        onConflict:'slot_date,start_time'
      }
    );

  if(error){

    alert(
      '変更できませんでした。'
    );

    return;

  }

  await load();

}


document
.getElementById('openAll')
.onclick=()=>setAll(true);


document
.getElementById('closeAll')
.onclick=()=>setAll(false);


document
.getElementById('addBooking')
.onclick=async()=>{

  const p_date=
    document
    .getElementById('date')
    .value;

  const p_menu_id=
    document
    .getElementById('menu')
    .value;

  const p_start_time=
    document
    .getElementById('adminTime')
    .value;

  const p_customer_name=
    document
    .getElementById('customerName')
    .value
    .trim();

  const p_phone=
    document
    .getElementById('phone')
    .value
    .trim();

  const p_memo=
    document
    .getElementById('memo')
    .value
    .trim()
    || null;

  const msg=
    document
    .getElementById('addMsg');


  if(
    !p_date
    ||
    !p_menu_id
    ||
    !p_start_time
    ||
    !p_customer_name
    ||
    !p_phone
  ){

    msg.textContent=
      '日付・メニュー・時間・お客様名・電話番号を入力してください。';

    return;

  }


  const {
    error
  }=
  await supabase.rpc(
    'nakano_create_booking',
    {
      p_date,
      p_start_time,
      p_menu_id,
      p_customer_name,
      p_phone,
      p_memo
    }
  );


  if(error){

    msg.textContent=
      '予約を追加できませんでした。';

    await loadAdminTimes();

    return;

  }


  msg.textContent=
    '予約を追加しました。';


  document
  .getElementById('customerName')
  .value='';

  document
  .getElementById('phone')
  .value='';

  document
  .getElementById('memo')
  .value='';


  await load();

};


async function cancelBooking(id){

  const ok=
    confirm(
      'この予約をキャンセルしますか？'
    );

  if(!ok){

    return;

  }

  const {
    error
  }=
  await supabase
    .from('nakano_bookings')
    .update({
      status:'cancelled'
    })
    .eq('id',id);

  if(error){

    alert(
      'キャンセルできませんでした。'
    );

    return;

  }

  await load();

}


async function load(){

  const date=
    document
    .getElementById('date')
    .value;

  if(!date){

    return;

  }


  const {
    data:slotRows,
    error:slotError
  }=
  await supabase
    .from('nakano_open_slots')
    .select('*')
    .eq('slot_date',date);


  const slotBox=
    document
    .getElementById('slots');

  slotBox.innerHTML='';


  if(slotError){

    slotBox.innerHTML=
      '<span class="muted">空き枠を読み込めませんでした。</span>';

    return;

  }


  const map=
    new Map(
      (slotRows||[])
      .map(
        row=>[
          String(row.start_time),
          row
        ]
      )
    );


  times.forEach(
    time=>{

      const row=
        map.get(time);

      const isOpen=
        !!row?.is_open;

      const button=
        document.createElement('button');

      button.className=
        'slot '
        +
        (
          isOpen
          ?
          'open'
          :
          'closed'
        );

      button.textContent=
        time.slice(0,5);


      button.onclick=
        async()=>{

          const {
            error
          }=
          await supabase
            .from('nakano_open_slots')
            .upsert(
              {
                slot_date:date,
                start_time:time,
                is_open:!isOpen
              },
              {
                onConflict:
                  'slot_date,start_time'
              }
            );

          if(error){

            alert(
              '変更できませんでした。'
            );

          }

          await load();

        };


      slotBox.appendChild(button);

    }
  );


  const {
    data:bookings,
    error:bookingError
  }=
  await supabase
    .from('nakano_bookings')
    .select('*')
    .eq('booking_date',date)
    .eq('status','confirmed')
    .order('start_time');


  const bookingBox=
    document
    .getElementById('bookings');


  if(bookingError){

    bookingBox.textContent=
      '予約一覧を読み込めませんでした。';

    return;

  }


  if(!bookings?.length){

    bookingBox.textContent=
      '予約はありません。';

  }
  else{

    bookingBox.innerHTML=
      bookings
      .map(
        booking=>
        `
        <div class="booking">

        <strong>
        ${String(booking.start_time).slice(0,5)}
        　
        ${booking.menu_name}
        </strong>

        <br>

        ${booking.customer_name}
        　
        ${booking.phone}

        ${
          booking.memo
          ?
          `<br>
          <span class="muted">
          ${booking.memo}
          </span>`
          :
          ''
        }

        <br>

        <button
          class="danger cancelBtn"
          data-id="${booking.id}"
        >
        予約をキャンセル
        </button>

        </div>
        `
      )
      .join('');


    document
    .querySelectorAll('.cancelBtn')
    .forEach(
      button=>{

        button.onclick=
          ()=>cancelBooking(
            button.dataset.id
          );

      }
    );

  }


  await loadAdminTimes();

}


supabase.auth.onAuthStateChange(
  syncAuth
);

syncAuth();

</script>

</main>
</body>
</html>
