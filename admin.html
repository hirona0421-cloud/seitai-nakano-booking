<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>整体なかの｜管理</title>

<style>
*{box-sizing:border-box}

html,body{
  max-width:100%;
  overflow-x:hidden
}

body{
  margin:0;
  background:#f6f3ee;
  color:#2f2d2a;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif
}

main{
  max-width:760px;
  margin:auto;
  padding:18px 14px 80px
}

.card{
  background:#fff;
  border:1px solid #e7e0d7;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  overflow:hidden
}

h1{
  margin:0;
  font-size:24px
}

h2{
  font-size:19px;
  margin:0 0 10px
}

h3{
  font-size:16px;
  margin:18px 0 8px
}

.muted{
  color:#77716a;
  font-size:13px;
  line-height:1.6
}

.hidden{
  display:none!important
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-top:8px
}

input,
select,
textarea,
button{
  font:inherit;
  max-width:100%
}

input,
select,
textarea{
  display:block;
  width:100%;
  min-width:0;
  padding:13px;
  border:1px solid #e7e0d7;
  border-radius:12px;
  margin:6px 0 10px;
  background:#fff
}

textarea{
  min-height:80px;
  resize:vertical
}

input[type="date"],
input[type="time"],
input[type="month"]{
  -webkit-appearance:none;
  appearance:none;
  height:48px
}

.primary,
.secondary,
.danger{
  width:100%;
  border-radius:13px;
  padding:13px;
  font-weight:700
}

.primary{
  background:#61574d;
  color:#fff;
  border:0
}

.secondary{
  background:#fff;
  color:#4a4642;
  border:1px solid #ddd5cc;
  margin-top:8px
}

.danger{
  background:#fff;
  color:#9b4138;
  border:1px solid #d8aaa5;
  margin-top:8px
}

button:disabled{
  opacity:.55
}

.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:8px
}

.field{
  min-width:0
}


/* =========================
   管理トップ
========================= */

.adminLinks{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px
}

.adminLinks a{
  text-decoration:none
}

.adminLinks button{
  margin:0
}


/* =========================
   横型タイムライン
========================= */

.scheduleHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:10px
}

.scheduleScroll{
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:6px
}

.scheduleCanvas{
  position:relative;
  min-width:1740px;
  height:132px;
  background:#faf8f5;
  border:1px solid #e7e0d7;
  border-radius:14px;
  overflow:hidden
}

.timeHeader{
  position:absolute;
  left:0;
  top:0;
  height:34px;
  width:100%
}

.timeMark{
  position:absolute;
  top:0;
  height:34px;
  border-left:1px solid #ded7cf;
  padding-left:4px;
  font-size:11px;
  color:#77716a;
  white-space:nowrap
}

.scheduleLane{
  position:absolute;
  left:0;
  right:0;
  top:34px;
  height:98px
}

.scheduleCell{
  position:absolute;
  top:0;
  height:98px;
  border-left:1px solid #ebe5de
}

.openCell{
  background:#f1f7f2
}

.closedCell{
  background:#f1f0ee
}

.blockedSchedule{
  position:absolute;
  top:8px;
  height:82px;
  background:#f4dfdc;
  border:1px solid #dda8a1;
  border-radius:10px;
  padding:8px;
  overflow:hidden;
  z-index:3;
  font-size:11px;
  color:#8a4a42
}

.bookingBlock{
  position:absolute;
  top:8px;
  height:82px;
  background:#fff;
  border:2px solid #9c8d7d;
  border-radius:10px;
  padding:8px;
  overflow:hidden;
  z-index:5;
  cursor:pointer;
  box-shadow:0 2px 7px rgba(0,0,0,.08)
}

.bookingTime{
  font-size:11px;
  color:#77716a;
  white-space:nowrap
}

.bookingName{
  margin-top:3px;
  font-weight:800;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.bookingMenu{
  margin-top:3px;
  font-size:11px;
  line-height:1.35;
  overflow:hidden
}

.scheduleLegend{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:10px;
  font-size:12px;
  color:#6e6862
}

.legendItem{
  display:flex;
  align-items:center;
  gap:5px
}

.legendDot{
  width:13px;
  height:13px;
  border-radius:4px;
  border:1px solid #ddd
}

.legendOpen{
  background:#f1f7f2
}

.legendBooking{
  background:#fff;
  border:2px solid #9c8d7d
}

.legendBlocked{
  background:#f4dfdc
}

.legendClosed{
  background:#f1f0ee
}


/* =========================
   OPEN CLOSE
========================= */

.slots{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px
}

.slot{
  min-width:0;
  border:1px solid #e7e0d7;
  border-radius:12px;
  padding:12px 5px;
  font-weight:700;
  min-height:58px;
  line-height:1.25
}

.slotTime{
  display:block;
  font-size:16px
}

.slotLabel{
  display:block;
  font-size:10px;
  margin-top:3px
}

.open{
  background:#eaf3ec;
  color:#168047
}

.closed{
  background:#eeeeec;
  color:#8a8580
}

.busy{
  background:#f6dddd;
  color:#9b4138
}


/* =========================
   複数日選択
========================= */

.daySelector{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-top:10px
}

.dayButton{
  min-width:0;
  min-height:43px;
  padding:6px 2px;
  border:1px solid #ddd5cc;
  border-radius:9px;
  background:#fff;
  color:#4d4843;
  font-size:12px
}

.dayButton.selected{
  background:#61574d;
  border-color:#61574d;
  color:#fff
}

.dayButton.other{
  opacity:.35
}

.weekHeader{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-top:10px;
  text-align:center;
  font-size:11px;
  color:#77716a
}

.selectedDatesBox{
  background:#faf8f5;
  border-radius:11px;
  padding:10px;
  margin:10px 0;
  font-size:12px;
  line-height:1.6
}


/* =========================
   一覧系
========================= */

.blockedItem,
.notificationItem{
  padding:12px 0;
  border-bottom:1px solid #e7e0d7;
  line-height:1.5
}

.blockedItem:last-child,
.notificationItem:last-child{
  border-bottom:0
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:8px
}

.actions button{
  width:auto;
  padding:8px 11px;
  border-radius:9px
}

.editBtn{
  background:#fff;
  border:1px solid #b7aea5
}

.cancelBtn{
  background:#fff;
  color:#9b4138;
  border:1px solid #d8aaa5
}

.badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:999px;
  background:#f4ece9;
  color:#705f58;
  font-size:12px;
  font-weight:700;
  margin-left:6px
}

.msg{
  font-size:13px;
  line-height:1.5;
  margin-top:8px
}

.customerBox{
  background:#faf8f5;
  border-radius:13px;
  padding:12px;
  margin-bottom:12px
}


/* =========================
   折りたたみ
========================= */

details.settingsDetails{
  border:1px solid #e7e0d7;
  border-radius:14px;
  overflow:hidden
}

details.settingsDetails summary{
  padding:15px;
  cursor:pointer;
  font-weight:700;
  background:#faf8f5;
  list-style:none
}

details.settingsDetails summary::-webkit-details-marker{
  display:none
}

.settingsInner{
  padding:16px
}

.checkRow{
  display:flex;
  align-items:center;
  gap:8px;
  margin:12px 0;
  font-size:14px
}

.checkRow input{
  width:auto;
  margin:0
}

@media(max-width:500px){

  main{
    padding-left:10px;
    padding-right:10px
  }

  .row{
    grid-template-columns:1fr
  }

  .adminLinks{
    grid-template-columns:1fr 1fr
  }

  .scheduleCanvas{
    min-width:1740px
  }

  .slots{
    grid-template-columns:repeat(3,minmax(0,1fr))
  }

}
</style>
</head>

import {createClient}
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


const supabase=
createClient(
  'https://scjzofjyxmchfjsngqtb.supabase.co',
  'sb_publishable_EGlr-6w0xh4gD8OImboE_Q_V-COJ7t9'
);


const LIFF_ID=
  '2011071292-KT8sSyCN';


const $=
id=>document.getElementById(id);


/* =========================
   時間設定
========================= */

const DAY_START=
  8*60;

const DAY_END=
  22*60+30;

const PX_PER_MINUTE=
  2;

const CELL_MINUTES=
  30;


const times=[];

for(
  let minutes=DAY_START;
  minutes<=DAY_END;
  minutes+=30
){

  const h=
    Math.floor(
      minutes/60
    );

  const m=
    minutes%60;

  times.push(
    `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00`
  );

}


let menus=[];
let customers=[];
let editingBooking=null;

let currentBookings=[];
let currentBlocked=[];
let currentSlots=[];

let selectedBlockedDates=
  new Set();


/* =========================
   共通
========================= */

function esc(value){

  return String(value??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");

}


function todayJapan(){

  const parts=
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:'Asia/Tokyo',
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }
    ).formatToParts(
      new Date()
    );


  const get=
    type=>
      parts.find(
        p=>p.type===type
      )?.value;


  return `${
    get('year')
  }-${
    get('month')
  }-${
    get('day')
  }`;

}


function monthFromDate(date){

  return date
    ?
    date.slice(0,7)
    :
    '';

}


function datesInMonth(month){

  const [year,mon]=
    month
      .split('-')
      .map(Number);


  const last=
    new Date(
      year,
      mon,
      0
    ).getDate();


  const dates=[];


  for(
    let d=1;
    d<=last;
    d++
  ){

    dates.push(
      `${year}-${String(mon).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    );

  }


  return dates;

}


function nextMonthStart(month){

  const [year,mon]=
    month
      .split('-')
      .map(Number);


  const next=
    new Date(
      Date.UTC(
        year,
        mon,
        1
      )
    );


  return `${
    next.getUTCFullYear()
  }-${
    String(
      next.getUTCMonth()+1
    ).padStart(2,'0')
  }-01`;

}


function timeToMinutes(time){

  const [h,m]=
    String(time)
      .slice(0,5)
      .split(':')
      .map(Number);


  return h*60+m;

}


function menuMinutes(booking){

  if(
    Number(
      booking.minutes
    )>0
  ){

    return Number(
      booking.minutes
    );

  }


  const menu=
    menus.find(
      m=>
        String(m.id)
        ===
        String(
          booking.menu_id
        )
    );


  return Number(
    menu?.minutes
    ||
    30
  );

}


function overlaps(
  aStart,
  aEnd,
  bStart,
  bEnd
){

  return (
    aStart<bEnd
    &&
    aEnd>bStart
  );

}


/* =========================
   認証
========================= */

async function syncAuth(){

  const {
    data:{session}
  }=
    await supabase.auth
      .getSession();


  $('loginCard')
    .classList
    .toggle(
      'hidden',
      !!session
    );


  $('adminArea')
    .classList
    .toggle(
      'hidden',
      !session
    );


  if(!session){
    return;
  }


  if(
    !$('date').value
  ){

    $('date').value=
      todayJapan();

  }


  if(
    !$('month').value
  ){

    $('month').value=
      monthFromDate(
        $('date').value
      );

  }


  if(
    !$('adminBookingDate').value
  ){

    $('adminBookingDate').value=
      $('date').value;

  }


  await loadMenus();

  await loadCustomers();

  renderDaySelector();

  await loadDay();

  await loadMonthBlockedTimes();

  await loadNotifications();

  await resumePendingLineLink();

}


$('login').onclick=
async()=>{

  const {error}=
    await supabase.auth
      .signInWithPassword({

        email:
          $('email')
            .value
            .trim(),

        password:
          $('password')
            .value

      });


  if(error){

    $('loginMsg').textContent=
      'ログインできませんでした。';

    return;

  }


  $('loginMsg').textContent='';

  await syncAuth();

};


$('logout').onclick=
async()=>{

  await supabase.auth
    .signOut();

  await syncAuth();

};


/* =========================
   メニュー
========================= */

async function loadMenus(){

  const {data,error}=
    await supabase
      .from(
        'nakano_menus'

function renderTimeHeader(){

  const box=
    $('timeHeader');


  box.innerHTML='';


  for(
    let min=DAY_START;
    min<=DAY_END;
    min+=30
  ){

    const mark=
      document.createElement(
        'div'
      );


    mark.className=
      'timeMark';


    mark.style.left=
      `${
        (
          min-DAY_START
        )
        *
        PX_PER_MINUTE
      }px`;


    mark.style.width=
      `${
        30
        *
        PX_PER_MINUTE
      }px`;


    mark.textContent=
      `${
        String(
          Math.floor(min/60)
        ).padStart(2,'0')
      }:${
        String(
          min%60
        ).padStart(2,'0')
      }`;


    box.appendChild(
      mark
    );

  }

}


function renderTimeline(){

  renderTimeHeader();


  const lane=
    $('scheduleLane');


  lane.innerHTML='';


  const slotMap=
    new Map(

      currentSlots.map(
        row=>[
          String(
            row.start_time
          ),
          row
        ]
      )

    );


  for(
    let min=DAY_START;
    min<=DAY_END;
    min+=30
  ){

    const time=
      `${
        String(
          Math.floor(min/60)
        ).padStart(2,'0')
      }:${
        String(
          min%60
        ).padStart(2,'0')
      }:00`;


    const row=
      slotMap.get(
        time
      );


    const cell=
      document.createElement(
        'div'
      );


    cell.className=
      'scheduleCell '
      +
      (
        row?.is_open
        ?
        'openCell'
        :
        'closedCell'
      );


    cell.style.left=
      `${
        (
          min-DAY_START
        )
        *
        PX_PER_MINUTE
      }px`;


    cell.style.width=
      `${
        30
        *
        PX_PER_MINUTE
      }px`;


    lane.appendChild(
      cell
    );

  }


  currentBlocked.forEach(
    item=>{

      const start=
        timeToMinutes(
          item.start_time
        );


      let end=
        timeToMinutes(
          item.end_time
        );


      if(
        String(
          item.end_time
        ).startsWith(
          '23:59'
        )
      ){

        end=
          DAY_END+30;

      }


      const visibleStart=
        Math.max(
          start,
          DAY_START
        );


      const visibleEnd=
        Math.min(
          end,
          DAY_END+30
        );


      if(
        visibleEnd<=visibleStart
      ){
        return;
      }


      const block=
        document.createElement(
          'div'
        );


      block.className=
        'blockedSchedule';


      block.style.left=
        `${
          (
            visibleStart
            -
            DAY_START
          )
          *
          PX_PER_MINUTE
        }px`;


      block.style.width=
        `${
          Math.max(
            36,
            (
              visibleEnd
              -
              visibleStart
            )
            *
            PX_PER_MINUTE
          )
        }px`;


      block.innerHTML=`

        <strong>
          予約不可
        </strong>

        <br>

        ${
          esc(
            item.memo
            ||
            ''
          )
        }

      `;


      lane.appendChild(
        block
      );

    }
  );


  currentBookings.forEach(
    booking=>{

      const start=
        timeToMinutes(
          booking.start_time
        );


      const duration=
        menuMinutes(
          booking
        );


      const block=
        document.createElement(
          'div'
        );


      block.className=
        'bookingBlock';


      block.style.left=
        `${
          (
            start-DAY_START
          )
          *
          PX_PER_MINUTE
        }px`;


      block.style.width=
        `${
          Math.max(
            72,
            duration
            *
            PX_PER_MINUTE
          )
        }px`;


      block.innerHTML=`

        <div class="bookingTime">

          ${
            esc(
              String(
                booking.start_time
              ).slice(
                0,
                5
              )
            )
          }

        </div>

        <div class="bookingName">

          ${
            esc(
              booking.customer_name
            )
          }

        </div>

        <div class="bookingMenu">

          ${
            esc(
              booking.menu_name
            )
          }

        </div>

      `;


      block.onclick=
        ()=>openEdit(
          booking
        );


      lane.appendChild(
        block
      );

    }
  );

}

   当日データ
========================= */

async function loadDay(){

  const date=
    $('date').value;


  if(!date){
    return;
  }


  const [
    slotResult,
    bookingResult,
    blockedResult
  ]=
    await Promise.all([

      supabase
        .from(
          'nakano_open_slots'
        )
        .select('*')
        .eq(
          'slot_date',
          date
        ),

      supabase
        .from(
          'nakano_bookings'
        )
        .select('*')
        .eq(
          'booking_date',
          date
        )
        .eq(
          'status',
          'confirmed'
        )
        .order(
          'start_time'
        ),

      supabase
        .from(
          'nakano_blocked_times'
        )
        .select('*')
        .eq(
          'blocked_date',
          date
        )
        .order(
          'start_time'
        )

    ]);


  if(
    slotResult.error
    ||
    bookingResult.error
    ||
    blockedResult.error
  ){

    console.error(
      slotResult.error,
      bookingResult.error,
      blockedResult.error
    );


    $('scheduleMsg').textContent=
      '予定を読み込めませんでした。';


    return;

  }


  currentSlots=
    slotResult.data||[];


  currentBookings=
    bookingResult.data||[];


  currentBlocked=
    blockedResult.data||[];


  renderTimeline();

  renderSlots();

  await loadAdminTimes();

}


/* =========================
   30分OPEN CLOSE表示
========================= */

function renderSlots(){

  const box=
    $('slots');


  box.innerHTML='';


  const map=
    new Map(

      currentSlots.map(
        row=>[
          String(
            row.start_time
          ),
          row
        ]
      )

    );


  times.forEach(
    time=>{

      const row=
        map.get(
          time
        );


      const isOpen=
        !!row?.is_open;


      const start=
        timeToMinutes(
          time
        );


      const end=
        start+30;


      const booking=
        currentBookings.find(
          b=>{

            const bs=
              timeToMinutes(
                b.start_time
              );


            return overlaps(
              start,
              end,
              bs,
              bs+menuMinutes(b)
            );

          }
        );


      const blocked=
        currentBlocked.find(
          b=>{

            const bs=
              timeToMinutes(
                b.start_time
              );


            let be=
              timeToMinutes(
                b.end_time
              );


            if(
              String(
                b.end_time
              ).startsWith(
                '23:59'
              )
            ){

              be=
                24*60;

            }


            return overlaps(
              start,
              end,
              bs,
              be
            );

          }
        );


      const button=
        document.createElement(
          'button'
        );


      if(
        booking
        ||
        blocked
      ){

        button.className=
          'slot busy';


        button.innerHTML=`

          <span class="slotTime">

            ${
              esc(
                time.slice(
                  0,
                  5
                )
              )
            }

          </span>

          <span class="slotLabel">

            ${
              booking
              ?
              '予約'
              :
              '予定'
            }

          </span>

        `;


        button.onclick=
        ()=>{

          if(booking){

            openEdit(
              booking
            );

          }

        };

      }
      else{

        button.className=
          `slot ${
            isOpen
            ?
            'open'
            :
            'closed'
          }`;


        button.innerHTML=`

          <span class="slotTime">

            ${
              esc(
                time.slice(
                  0,
                  5
                )
              )
            }

          </span>

          <span class="slotLabel">

            ${
              isOpen
              ?
              '空き'
              :
              'CLOSE'
            }

          </span>

        `;


        button.onclick=
        async()=>{

          const {error}=
            await supabase
              .from(
                'nakano_open_slots'
              )
              .upsert(
                {

                  slot_date:
                    $('date').value,

                  start_time:
                    time,

                  is_open:
                    !isOpen

                },
                {
                  onConflict:
                    'slot_date,start_time'
                }
              );


          if(error){

            alert(
              '変更できませんでした。'
            );

            return;

          }


          await loadDay();

        };

      }


      box.appendChild(
        button
      );

    }
  );

}

async function setMonth(open){

  const month=
    $('month').value;


  if(!month){

    $('monthMsg').textContent=
      '月を選択してください。';

    return;

  }


  if(
    !confirm(
      `${month} を全部${open?'OPEN':'CLOSE'}にしますか？`
    )
  ){
    return;
  }


  $('monthMsg').textContent=
    '変更しています…';


  const rows=[];


  for(
    const date
    of datesInMonth(month)
  ){

    for(
      const time
      of times
    ){

      rows.push({

        slot_date:
          date,

        start_time:
          time,

        is_open:
          open

      });

    }

  }


  try{

    for(
      let i=0;
      i<rows.length;
      i+=500
    ){

      const {error}=
        await supabase
          .from(
            'nakano_open_slots'
          )
          .upsert(
            rows.slice(
              i,
              i+500
            ),
            {
              onConflict:
                'slot_date,start_time'
            }
          );


      if(error){
        throw error;
      }

    }


    $('monthMsg').textContent=
      '変更しました。';


    if(
      $('date')
        .value
        .startsWith(
          month
        )
    ){

      await loadDay();

    }

  }
  catch(error){

    console.error(error);


    $('monthMsg').textContent=
      '変更できませんでした。';

  }

}


$('openMonth').onclick=
()=>setMonth(true);


$('closeMonth').onclick=
()=>setMonth(false);


/* =========================
   複数日カレンダー
========================= */

function renderDaySelector(){

  const month=
    $('month').value;


  if(!month){
    return;
  }


  const [year,mon]=
    month
      .split('-')
      .map(Number);


  const firstWeekday=
    new Date(
      year,
      mon-1,
      1
    ).getDay();


  const days=
    new Date(
      year,
      mon,
      0
    ).getDate();


  const box=
    $('daySelector');


  box.innerHTML='';


  for(
    let i=0;
    i<firstWeekday;
    i++
  ){

    const empty=
      document.createElement(
        'div'
      );


    box.appendChild(
      empty
    );

  }


  for(
    let day=1;
    day<=days;
    day++
  ){

    const date=
      `${year}-${String(mon).padStart(2,'0')}-${String(day).padStart(2,'0')}`;


    const button=
      document.createElement(
        'button'
      );


    button.type=
      'button';


    button.className=
      'dayButton';


    if(
      selectedBlockedDates.has(
        date
      )
    ){

      button.classList
        .add(
          'selected'
        );

    }


    button.textContent=
      day;


    button.onclick=
    ()=>{

      if(
        selectedBlockedDates.has(
          date
        )
      ){

        selectedBlockedDates.delete(
          date
        );

      }
      else{

        selectedBlockedDates.add(
          date
        );

      }


      renderDaySelector();

      renderSelectedDates();

    };


    box.appendChild(
      button
    );

  }


  renderSelectedDates();

}


function renderSelectedDates(){

  const dates=
    [
      ...selectedBlockedDates
    ].sort();


  if(!dates.length){

    $('selectedDatesBox').textContent=
      '日付を選択してください。';

    return;

  }


  $('selectedDatesBox').textContent=
    `選択中：${dates.map(d=>Number(d.slice(8))).join('日・')}日`;

}


/* =========================
   複数日予約不可
========================= */

async function saveBlockedMultiple(
  wholeDay=false
){

  const dates=
    [
      ...selectedBlockedDates
    ];


  if(!dates.length){

    $('blockedMsg').textContent=
      '日付を1日以上選択してください。';

    return;

  }


  let start=
    $('blockedStart').value;


  let end=
    $('blockedEnd').value;


  if(wholeDay){

    start=
      '00:00:00';

    end=
      '23:59:59';

  }
  else{

    if(
      !start
      ||
      !end
    ){

      $('blockedMsg').textContent=
        '開始時間と終了時間を入力してください。';

      return;

    }


    if(end<=start){

      $('blockedMsg').textContent=
        '終了時間を開始時間より後にしてください。';

      return;

    }

  }


  const memo=
    $('blockedMemo')
      .value
      .trim();


  const rows=
    dates.map(
      date=>({

        blocked_date:
          date,

        start_time:
          start,

        end_time:
          end,

        memo:
          wholeDay
          ?
          (
            memo
            ?
            `終日：${memo}`
            :
            '終日予約不可'
          )
          :
          (
            memo
            ||
            null
          )

      })
    );


  const {error}=
    await supabase
      .from(
        'nakano_blocked_times'
      )
      .insert(
        rows
      );


  if(error){

    console.error(error);


    $('blockedMsg').textContent=
      '登録できませんでした。';

    return;

  }


  $('blockedMsg').textContent=
    `${dates.length}日分を登録しました。`;


  selectedBlockedDates=
    new Set();


  $('blockedStart').value='';

  $('blockedEnd').value='';

  $('blockedMemo').value='';


  renderDaySelector();


  await loadMonthBlockedTimes();

  await loadDay();

  await loadAdminTimes();

}


$('addBlockedTime').onclick=
()=>saveBlockedMultiple(false);


$('addBlockedDay').onclick=
()=>saveBlockedMultiple(true);


/* =========================
   予約不可一覧
========================= */

async function loadMonthBlockedTimes(){

  const month=
    $('month').value;


  if(!month){
    return;
  }


  const {data,error}=
    await supabase
      .from(
        'nakano_blocked_times'
      )
      .select('*')
      .gte(
        'blocked_date',
        `${month}-01`
      )
      .lt(
        'blocked_date',
        nextMonthStart(
          month
        )
      )
      .order(
        'blocked_date'
      )
      .order(
        'start_time'
      );


  if(error){

    console.error(error);

    return;

  }


  const box=
    $('blockedList');


  if(!data?.length){

    box.innerHTML=
      '<span class="muted">この月の設定はありません。</span>';

    return;

  }


  box.innerHTML=
    data.map(
      item=>{

        const start=
          String(
            item.start_time
          ).slice(
            0,
            5
          );


        const end=
          String(
            item.end_time
          ).slice(
            0,
            5
          );


        const wholeDay=
          start==='00:00'
          &&
          end.startsWith(
            '23:59'
          );


        return `

          <div class="blockedItem">

            <strong>

              ${esc(item.blocked_date)}

              ${
                wholeDay
                ?
                '<span class="badge">終日</span>'
                :
                ''
              }

            </strong>

            <br>

            ${
              wholeDay
              ?
              '終日予約不可'
              :
              `${esc(start)} ～ ${esc(end)}`
            }

            ${
              item.memo
              ?
              `<br><span class="muted">${esc(item.memo)}</span>`
              :
              ''
            }

            <div class="actions">

              <button
                class="cancelBtn deleteBlocked"
                data-id="${esc(item.id)}"
              >
                解除
              </button>

            </div>

          </div>

        `;

      }
    ).join('');


  document
    .querySelectorAll(
      '.deleteBlocked'
    )
    .forEach(
      button=>{

        button.onclick=
        async()=>{

          if(
            !confirm(
              'この予約不可設定を解除しますか？'
            )
          ){
            return;
          }


          const {error}=
            await supabase
              .from(
                'nakano_blocked_times'
              )
              .delete()
              .eq(
                'id',
                button.dataset.id
              );


          if(error){

            alert(
              '解除できませんでした。'
            );

            return;

          }


          await loadMonthBlockedTimes();

          await loadDay();

          await loadAdminTimes();

        };

      }
    );

}

async function getAvailableTimes(

  date
){

    !menuId

  ){

  }


  const {data,error}=
    await supabase.rpc(
      'nakano_available_slots',
      {

        p_date:
          date,

        p_menu_id:
          menuId

      }
    );


  if(error){

    console.error(error);

    return [];

  }


  return data||[];

}

    );


  if(error){

    console.error(error);


    $('addMsg').textContent=
      '予約を追加できませんでした。';

    return;

  }


  $('addMsg').textContent=
    '予約を追加しました。';


  $('customerName').value='';

  $('phone').value='';

  $('memo').value='';


  await loadCustomers();

  await loadDay();

  await loadAdminTimes();

};


/* =========================
   予約編集
========================= */

function openEdit(
  booking
){

  editingBooking=
    booking;


  $('editCard')
    .classList
    .remove(
      'hidden'
    );


  $('editCurrent').textContent=
    `${booking.customer_name}　${booking.menu_name}`;


  $('editDate').value=
    booking.booking_date;


  $('editMenu').value=
    booking.menu_id;


  $('editName').value=
    booking.customer_name
    ||
    '';


  $('editPhone').value=
    booking.phone
    ||
    '';


  $('editMemo').value=
    booking.memo
    ||
    '';


  $('editMsg').textContent='';


  loadEditTimes();


  $('editCard')
    .scrollIntoView({
      behavior:'smooth',
      block:'start'
    });

}


function closeEdit(){

  editingBooking=
    null;


  $('editCard')
    .classList
    .add(
      'hidden'
    );

}


$('cancelEdit').onclick=
  closeEdit;


$('editMenu').onchange=
  loadEditTimes;


$('editDate').onchange=
  loadEditTimes;


async function loadEditTimes(){

  if(
    !editingBooking
  ){
    return;
  }


  const select=
    $('editTime');


  select.innerHTML=
    '<option value="">時間を選択</option>';


  let data=
    await getAvailableTimes(
      $('editMenu').value,
      $('editDate').value
    );


  const originalTime=
    String(
      editingBooking.start_time
    );


  const originalDate=
    $('editDate').value
    ===
    editingBooking.booking_date;


  if(
    originalDate
    &&
    !data.some(
      slot=>
        String(
          slot.start_time
        )
        ===
        originalTime
    )
  ){

    data.push({
      start_time:
        originalTime
    });

  }


  data.sort(
    (a,b)=>
      String(
        a.start_time
      ).localeCompare(
        String(
          b.start_time
        )
      )
  );


  data.forEach(
    slot=>{

      const option=
        document.createElement(
          'option'
        );


      option.value=
        slot.start_time;


      option.textContent=
        String(
          slot.start_time
        ).slice(
          0,
          5
        );


      if(
        originalDate
        &&
        String(
          slot.start_time
        )
        ===
        originalTime
      ){

        option.selected=
          true;

      }


      select.appendChild(
        option
      );

    }
  );

}


$('saveEdit').onclick=
async()=>{

  if(
    !editingBooking
  ){
    return;
  }


  const payload={

    p_booking_id:
      editingBooking.id,

    p_date:
      $('editDate').value,

    p_start_time:
      $('editTime').value,

    p_menu_id:
      $('editMenu').value,

    p_customer_name:
      $('editName')
        .value
        .trim(),

    p_phone:
      $('editPhone')
        .value
        .trim(),

    p_memo:
      $('editMemo')
        .value
        .trim()
      ||
      null

  };


  const {error}=
    await supabase.rpc(
      'nakano_admin_change_booking',
      payload
    );


  if(error){

    console.error(error);


    $('editMsg').textContent=
      '変更できませんでした。';


    return;

  }


  $('date').value=
    payload.p_date;


  $('month').value=
    monthFromDate(
      payload.p_date
    );


  closeEdit();


  renderDaySelector();


  await loadDay();

  await loadMonthBlockedTimes();

};


$('cancelBookingFromEdit').onclick=
async()=>{

  if(
    !editingBooking
  ){
    return;
  }


  if(
    !confirm(
      'この予約をキャンセルしますか？'
    )
  ){
    return;
  }


  const {error}=
    await supabase.rpc(
      'nakano_admin_cancel_booking',
      {
        p_booking_id:
          editingBooking.id
      }
    );


  if(error){

    alert(
      'キャンセルできませんでした。'
    );

    return;

  }


  closeEdit();

  await loadDay();

};


/* =========================
   通知設定
========================= */

async function getLineProfileForAdmin(){

  await liff.init({
    liffId:LIFF_ID
  });


  if(
    !liff.isLoggedIn()
  ){
    return null;
  }


  return await liff
    .getProfile();

}


async function attachCurrentLineToNotification(
  id
){

  localStorage.setItem(
    'nakano_pending_notification_line',
    id
  );


  await liff.init({
    liffId:LIFF_ID
  });


  if(
    !liff.isLoggedIn()
  ){

    liff.login({
      redirectUri:
        window.location.href
    });


    return;

  }


  const profile=
    await liff
      .getProfile();


  const {error}=
    await supabase.rpc(
      'nakano_attach_line_to_notification',
      {

        p_notification_id:
          String(id),

        p_line_user_id:
          profile.userId,

        p_line_display_name:
          profile.displayName
          ||
          null

      }
    );


  if(error){

    alert(
      'LINE連携に失敗しました。'
    );

    return;

  }


  localStorage.removeItem(
    'nakano_pending_notification_line'
  );


  await loadNotifications();


  alert(
    'LINE連携できました。'
  );

}


async function resumePendingLineLink(){

  const id=
    localStorage.getItem(
      'nakano_pending_notification_line'
    );


  if(!id){
    return;
  }


  try{

    const profile=
      await getLineProfileForAdmin();


    if(!profile){
      return;
    }


    await supabase.rpc(
      'nakano_attach_line_to_notification',
      {

        p_notification_id:
          String(id),

        p_line_user_id:
          profile.userId,

        p_line_display_name:
          profile.displayName
          ||
          null

      }
    );


    localStorage.removeItem(
      'nakano_pending_notification_line'
    );


    await loadNotifications();

  }
  catch(error){

    console.error(error);

  }

}


async function loadNotifications(){

  const {data,error}=
    await supabase
      .from(
        'nakano_notification_settings'
      )
      .select('*')
      .eq(
        'is_active',
        true
      )
      .order(
        'created_at'
      );


  if(error){
    return;
  }


  const box=
    $('notificationList');


  if(!data?.length){

    box.innerHTML=
      '<span class="muted">通知先はありません。</span>';

    return;

  }


  box.innerHTML=
    data.map(
      item=>`

        <div class="notificationItem">

          <strong>
            ${esc(item.name)}
          </strong>

          <br>

          <span class="muted">

            LINE：
            ${
              item.line_enabled
              ?
              'ON'
              :
              'OFF'
            }

            <br>

            ${
              item.line_user_id
              ?
              `連携済み：${esc(item.line_display_name||'LINEユーザー')}`
              :
              'LINE未連携'
            }

          </span>

          <div class="actions">

            <button
              class="editBtn linkLine"
              data-id="${esc(item.id)}"
            >
              LINE連携
            </button>

            <button
              class="cancelBtn deleteNotification"
              data-id="${esc(item.id)}"
            >
              削除
            </button>

          </div>

        </div>

      `
    ).join('');


  document
    .querySelectorAll(
      '.linkLine'
    )
    .forEach(
      button=>{

        button.onclick=
        ()=>attachCurrentLineToNotification(
          button.dataset.id
        );

      }
    );


  document
    .querySelectorAll(
      '.deleteNotification'
    )
    .forEach(
      button=>{

        button.onclick=
        async()=>{

          if(
            !confirm(
              'この通知先を削除しますか？'
            )
          ){
            return;
          }


          await supabase
            .from(
              'nakano_notification_settings'
            )
            .update({
              is_active:false
            })
            .eq(
              'id',
              button.dataset.id
            );


          await loadNotifications();

        };

      }
    );

}


$('addNotification').onclick=
async()=>{

  const name=
    $('notifyName')
      .value
      .trim();


  if(!name){

    $('notificationMsg').textContent=
      '通知先名を入力してください。';

    return;

  }


  const {error}=
    await supabase
      .from(
        'nakano_notification_settings'
      )
      .insert({

        name,

        email:
          $('notifyEmail')
            .value
            .trim()
          ||
          null,

        email_enabled:
          $('emailEnabled').checked,

        line_enabled:
          $('lineEnabled').checked,

        is_active:
          true

      });


  if(error){

    $('notificationMsg').textContent=
      '登録できませんでした。';

    return;

  }


  $('notificationMsg').textContent=
    '登録しました。';


  $('notifyName').value='';

  $('notifyEmail').value='';

  $('emailEnabled').checked=false;

  $('lineEnabled').checked=false;


  await loadNotifications();

};

   起動
========================= */

supabase.auth
  .onAuthStateChange(
    ()=>syncAuth()
  );


syncAuth();

</script>
