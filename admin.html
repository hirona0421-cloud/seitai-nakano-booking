<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>整体なかの｜管理</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  max-width:100%;
  overflow-x:hidden;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;
  margin:0;
  background:#f6f3ee;
  color:#2f2d2a;
}

main{
  max-width:620px;
  margin:auto;
  padding:18px 14px 80px;
}

.card{
  background:#fff;
  border:1px solid #e7e0d7;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  overflow:hidden;
}

h1{
  margin:0;
  font-size:24px;
}

h2{
  font-size:19px;
  margin:0 0 10px;
}

.muted{
  color:#77716a;
  font-size:13px;
  line-height:1.6;
}

input,
select,
textarea,
button{
  font:inherit;
  max-width:100%;
}

input,
select,
textarea{
  display:block;
  width:100%;
  min-width:0;
  padding:13px;
  border:1px solid #e7e0d7;
  border-radius:12px;
  margin:6px 0 10px;
  background:#fff;
}

input[type="date"],
input[type="time"],
input[type="month"]{
  min-width:0;
  width:100%;
  -webkit-appearance:none;
  appearance:none;
}

textarea{
  min-height:80px;
}

.primary,
.secondary,
.danger{
  width:100%;
  border-radius:13px;
  padding:13px;
  font-weight:700;
}

.primary{
  background:#61574d;
  color:#fff;
  border:0;
}

.secondary{
  background:#fff;
  border:1px solid #e7e0d7;
  margin-top:8px;
}

.danger{
  background:#fff;
  color:#9b4138;
  border:1px solid #d8aaa5;
  margin-top:8px;
}

.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:8px;
}

.row>*{
  min-width:0;
}

.slots{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}

.slot{
  min-width:0;
  border:1px solid #e7e0d7;
  border-radius:12px;
  padding:12px 6px;
  font-weight:700;
}

.open{
  background:#eaf3ec;
}

.closed{
  background:#f4ece9;
  color:#8a7770;
}

.booking{
  padding:12px 0;
  border-bottom:1px solid #e7e0d7;
  line-height:1.5;
}

.booking:last-child{
  border-bottom:0;
}

.bookingActions{
  display:flex;
  gap:8px;
  margin-top:9px;
  flex-wrap:wrap;
}

.bookingActions button{
  width:auto;
  padding:8px 12px;
  border-radius:10px;
  font-weight:700;
}

.editBtn{
  background:#fff;
  border:1px solid #b7aea5;
}

.cancelBtn{
  background:#fff;
  color:#9b4138;
  border:1px solid #d8aaa5;
}

.hidden{
  display:none;
}

.msg{
  font-size:13px;
  line-height:1.5;
  margin-top:8px;
}

.checkRow{
  display:flex;
  align-items:center;
  gap:8px;
  margin:12px 0;
  font-size:14px;
}

.checkRow input{
  width:auto;
  margin:0;
}

.notificationItem{
  padding:12px 0;
  border-bottom:1px solid #e7e0d7;
}

.notificationItem:last-child{
  border-bottom:0;
}

.smallBtn{
  width:auto;
  padding:7px 12px;
  margin-top:8px;
}

.monthTools{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid #eee7df;
}

.monthStatus{
  margin-top:8px;
}

@media(max-width:380px){

  .row{
    grid-template-columns:1fr;
  }

  .slots{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

}
</style>
</head>

<body>

<main>

<h1>整体なかの</h1>
<p class="muted">店側 予約管理</p>

<section class="card" id="loginCard">

<h2>管理者ログイン</h2>

<input
  id="email"
  type="email"
  placeholder="メールアドレス"
>

<input
  id="password"
  type="password"
  placeholder="パスワード"
>

<button
  class="primary"
  id="login"
>
ログイン
</button>

<p
  id="loginMsg"
  class="muted"
></p>

</section>


<div
  id="adminArea"
  class="hidden"
>

<section class="card">

<h2>管理日</h2>

<input
  type="date"
  id="date"
>

<button
  class="secondary"
  id="logout"
>
ログアウト
</button>

</section>


<section class="card">

<h2>空き枠 OPEN / CLOSE</h2>

<p class="muted">
OPENの時間だけお客様側に表示されます。
</p>

<div class="row">

<button
  class="secondary"
  id="openAll"
>
この日を全部OPEN
</button>

<button
  class="secondary"
  id="closeAll"
>
この日を全部CLOSE
</button>

</div>

<div
  id="slots"
  class="slots"
  style="margin-top:10px"
></div>


<div class="monthTools">

<h2>月単位で一括変更</h2>

<p class="muted">
選択した月の全日をまとめてOPEN / CLOSEできます。
</p>

<input
  type="month"
  id="month"
>

<div class="row">

<button
  class="secondary"
  id="openMonth"
>
この月を全部OPEN
</button>

<button
  class="secondary"
  id="closeMonth"
>
この月を全部CLOSE
</button>

</div>

<div
  id="monthMsg"
  class="msg muted monthStatus"
></div>

</div>

</section>


<section class="card">

<h2>予約不可時間</h2>

<p class="muted">
予定がある時間帯を登録すると、その時間と重なる予約枠はお客様側に表示されなくなります。
</p>

<div class="row">

<div>

<label>
開始時間
</label>

<input
  type="time"
  id="blockedStart"
  step="1800"
>

</div>

<div>

<label>
終了時間
</label>

<input
  type="time"
  id="blockedEnd"
  step="1800"
>

</div>

</div>

<input
  id="blockedMemo"
  placeholder="メモ　例：外出・私用（お
