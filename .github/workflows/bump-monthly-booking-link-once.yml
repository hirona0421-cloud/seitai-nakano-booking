name: Bump monthly booking link once
on:
  push:
    paths:
      - '.github/workflows/bump-monthly-booking-link-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          old='monthly-booking-page-link.js?v=20260816-1'
          new='monthly-booking-page-link.js?v=20260816-2'
          assert old in s or new in s
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit and self-remove
        run: |
          rm -f .github/workflows/bump-monthly-booking-link-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use fixed monthly booking navigation script'
          git push
