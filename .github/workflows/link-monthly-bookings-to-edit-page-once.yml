name: Link monthly booking list to edit page once
on:
  push:
    paths:
      - '.github/workflows/link-monthly-bookings-to-edit-page-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add standalone edit page loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          marker='<script type="module">import(`./booking-drag.js?_v=${Date.now()}`);</script>'
          add=marker+'\n<script src="./monthly-booking-page-link.js?v=20260816-1"></script>'
          if 'monthly-booking-page-link.js' not in s:
              assert marker in s
              s=s.replace(marker,add,1)
              p.write_text(s)
          assert 'monthly-booking-page-link.js?v=20260816-1' in p.read_text()
          assert Path('booking-edit.html').exists()
          assert Path('monthly-booking-page-link.js').exists()
          PY
          node --check monthly-booking-page-link.js
      - name: Commit and self-remove
        run: |
          rm -f .github/workflows/link-monthly-bookings-to-edit-page-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Open monthly bookings in standalone edit page'
          git push
