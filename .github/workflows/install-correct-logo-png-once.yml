name: Install correct logo PNG once
on:
  push:
    paths:
      - '.github/workflows/install-correct-logo-png-once.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild verified PNG and switch customer pages
        run: |
          cat tmp/logo-part1.b64 tmp/logo-part2.b64 tmp/logo-part3.b64 tmp/logo-part4.b64 tmp/logo-part5.b64 > /tmp/nakano-logo.b64
          base64 -d /tmp/nakano-logo.b64 > assets/nakano-logo.png
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('assets/nakano-logo.png')
          data=p.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', data[:8]
          assert len(data) == 9656, len(data)
          assert hashlib.sha256(data).hexdigest() == '12c2eb1a68479f7af87781ef2950ada93d15be514f2c90994525298378af7eed'
          p=Path('customer-brand.js')
          s=p.read_text()
          s=re.sub(r"\./assets/nakano-logo\.(?:webp|png)\?v=[^']+", './assets/nakano-logo.png?v=20260816-1', s)
          assert './assets/nakano-logo.png?v=20260816-1' in s
          p.write_text(s)
          for name in ['index.html','cancel.html','karte.html']:
              q=Path(name)
              if not q.exists():
                  continue
              t=q.read_text()
              t=re.sub(r'customer-brand\.js\?v=[^"\']+', 'customer-brand.js?v=png-20260816-1', t)
              q.write_text(t)
          PY
          node --check customer-brand.js
      - name: Commit verified PNG and clean staging files
        run: |
          rm -f tmp/logo-part1.b64 tmp/logo-part2.b64 tmp/logo-part3.b64 tmp/logo-part4.b64 tmp/logo-part5.b64
          rm -f .github/workflows/install-correct-logo-png-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use verified PNG logo on customer pages'
          git push
