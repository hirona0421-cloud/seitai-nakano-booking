name: One-time load blocked-time drag

on:
  push:
    paths:
      - '.github/workflows/load-blocked-drag-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load blocked drag module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('booking-drag.js')
          s=p.read_text()
          line="import(`./blocked-drag.js?_v=${Date.now()}`);"
          if line not in s:
              s=s.rstrip()+"\n\n"+line+"\n"
              p.write_text(s)
          PY
      - name: Commit and remove one-time workflow
        run: |
          rm .github/workflows/load-blocked-drag-once.yml
          git config user.name "seitai-nakano"
          git config user.email "hirona0421@icloud.com"
          git add booking-drag.js .github/workflows/load-blocked-drag-once.yml
          git commit -m "Load blocked-time long-press drag"
          git push
