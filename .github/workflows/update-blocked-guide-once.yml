name: One-time update blocked drag guide

on:
  push:
    paths:
      - '.github/workflows/update-blocked-guide-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update guide text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('booking-drag.js')
          s=p.read_text()
          s=s.replace('予約不可／予定：タップで時間編集','予約不可／予定：タップで時間編集 ／ 長押し→左右で移動')
          s=s.replace('赤い「予約不可／予定」のブロックはタップすると、その場に開始・終了時間の編集欄が出ます。','赤い「予約不可／予定」はタップで時間編集、約0.4秒長押ししてから左右へ動かすと長さを保ったまま15分単位で移動できます。')
          p.write_text(s)
          PY
      - name: Commit and remove one-time workflow
        run: |
          rm .github/workflows/update-blocked-guide-once.yml
          git config user.name "seitai-nakano"
          git config user.email "hirona0421@icloud.com"
          git add booking-drag.js .github/workflows/update-blocked-guide-once.yml
          git commit -m "Update blocked-time drag instructions"
          git push
