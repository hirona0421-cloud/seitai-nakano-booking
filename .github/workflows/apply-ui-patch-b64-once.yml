name: Apply encoded UI patch once
on:
  push:
    paths:
      - '.github/workflows/apply-ui-patch-b64-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          node --check body-ellipse.js
          node --check booking-drag.js
      - name: Commit and self-remove
        run: |
          rm .github/workflows/apply-ui-patch-b64-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add body-ellipse.js booking-drag.js .github/workflows/apply-ui-patch-b64-once.yml
          git commit -m 'Add duplicate and monthly booking tap edit'
          git push
