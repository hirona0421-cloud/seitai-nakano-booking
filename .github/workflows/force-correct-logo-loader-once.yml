name: Force corrected logo loader once
on:
  push:
    paths:
      - '.github/workflows/force-correct-logo-loader-once.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace current brand script cache key
        run: sed -i 's/customer-brand.js?v=20260815-3/customer-brand.js?v=correct-20260815-2230/g' index.html karte.html cancel.html
      - name: Verify
        run: grep -q 'customer-brand.js?v=correct-20260815-2230' index.html && grep -q 'customer-brand.js?v=correct-20260815-2230' karte.html && grep -q 'customer-brand.js?v=correct-20260815-2230' cancel.html
      - name: Commit and self-remove
        run: |
          rm .github/workflows/force-correct-logo-loader-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html karte.html cancel.html .github/workflows/force-correct-logo-loader-once.yml
          git commit -m 'Force corrected logo loader on customer pages'
          git push
