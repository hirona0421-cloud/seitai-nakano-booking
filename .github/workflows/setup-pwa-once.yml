name: setup pwa once
on: push
permissions:
  contents: write
jobs:
  setup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Generate PWA files
        run: python3 scripts/setup_pwa_once.py
      - name: Verify PWA files
        run: |
          node --check pwa-register.js
          node --check sw.js
          python3 - <<'PY'
          import json
          from PIL import Image
          json.load(open('manifest.webmanifest'))
          for p,size in [('assets/app-icon-192.png',(192,192)),('assets/app-icon-512.png',(512,512)),('assets/app-icon-maskable-512.png',(512,512)),('assets/apple-touch-icon.png',(180,180))]:
              im=Image.open(p)
              assert im.size==size,(p,im.size)
          assert 'rel="manifest"' in open('index.html').read()
          assert 'pwa-register.js' in open('index.html').read()
          PY
      - name: Commit PWA and clean temporary setup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html manifest.webmanifest offline.html sw.js pwa-register.js assets/app-icon-192.png assets/app-icon-512.png assets/app-icon-maskable-512.png assets/apple-touch-icon.png
          git commit -m "Add installable PWA for customer booking"
          git rm scripts/setup_pwa_once.py .github/workflows/setup-pwa-once.yml
          git commit -m "Remove one-time PWA setup files [skip ci]"
          git push