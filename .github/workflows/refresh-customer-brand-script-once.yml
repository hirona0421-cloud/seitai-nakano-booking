name: Refresh customer brand script once
on:
  push:
    paths:
      - '.github/workflows/refresh-customer-brand-script-once.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump customer brand script URL
        run: sed -i 's/customer-brand.js?v=20260815-2/customer-brand.js?v=correct-20260815-2230/g' index.html karte.html cancel.html
      - name: Commit and self-remove
        run: |
          rm .github/workflows/refresh-customer-brand-script-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html karte.html cancel.html .github/workflows/refresh-customer-brand-script-once.yml
          git commit -m 'Force corrected customer logo script refresh'
          git push
