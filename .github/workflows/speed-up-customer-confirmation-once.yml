name: speed up customer confirmation once
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch customer confirmation flow
        run: python3 .github/patch-speed.py
      - name: Verify customer JavaScript
        run: |
          python3 -c "from pathlib import Path; s=Path('index.html').read_text(); a=s.index('<script type=\"module\">')+len('<script type=\"module\">'); b=s.index('</script>',a); Path('/tmp/customer-module.mjs').write_text(s[a:b])"
          node --check /tmp/customer-module.mjs
          grep -q "void finishBookingSetup" index.html
      - name: Commit fix and clean temporary files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Show booking success before notification setup [skip ci]"
          git rm .github/patch-speed.py .github/workflows/speed-up-customer-confirmation-once.yml
          git commit -m "Remove temporary confirmation speed files [skip ci]"
          git push