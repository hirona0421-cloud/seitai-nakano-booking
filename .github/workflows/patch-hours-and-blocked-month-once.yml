name: patch hours and blocked month once
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend
        run: python3 scripts/patch-hours-and-blocked-month.py
      - name: Verify JavaScript and cutoff UI
        run: |
          node --check booking-drag.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('admin.html').read_text()
          a=s.index('<script type="module">')+len('<script type="module">')
          b=s.index('</script>',a)
          Path('/tmp/admin-module.mjs').write_text(s[a:b])
          assert 'id="blockedMonth"' in s
          assert "$('blockedMonth').onchange" in s
          assert 'const DAY_END=\n  22*60;' in s
          d=Path('booking-drag.js').read_text()
          assert 'const DAY_END=22*60;' in d
          assert 'const LAST_VISIBLE_START=21*60+45;' in d
          assert 'for(let hour=8;hour<=21;hour++)' in d
          PY
          node --check /tmp/admin-module.mjs
      - name: Commit patch and remove temporary files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin.html booking-drag.js
          git commit -m "Enforce 22:00 closing UI and add blocked month switcher"
          git rm scripts/patch-hours-and-blocked-month.py .github/workflows/patch-hours-and-blocked-month-once.yml
          git commit -m "Remove one-time hours patch files [skip ci]"
          git push
