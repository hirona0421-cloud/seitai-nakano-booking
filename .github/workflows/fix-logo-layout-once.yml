name: Fix corrected logo layout once
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Adjust corrected logo sizing and cache versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('customer-brand.css')
          s=p.read_text()
          s=s.replace('.brandLogo{display:block;width:148px;height:148px;', '.brandLogo{display:block;width:190px;height:130px;')
          s=s.replace('.brandHero.compact .brandLogo{width:112px;height:112px}', '.brandHero.compact .brandLogo{width:150px;height:102px}')
          s=s.replace('.brandMiniLogo{display:block;width:150px;height:150px;', '.brandMiniLogo{display:block;width:220px;height:149px;')
          s=s.replace('.brandLogo{width:118px;height:118px}', '.brandLogo{width:138px;height:94px}')
          s=s.replace('.brandHero.compact .brandLogo{width:92px;height:92px}', '.brandHero.compact .brandLogo{width:118px;height:80px}')
          s=s.replace('.brandMiniLogo{width:125px;height:125px}', '.brandMiniLogo{width:190px;height:129px}')
          s=s.replace('@media(max-width:360px){.brandLogo{width:100px;height:100px}', '@media(max-width:360px){.brandLogo{width:122px;height:83px}')
          p.write_text(s)
          for name in ['index.html','karte.html','cancel.html']:
              p=Path(name); s=p.read_text()
              s=s.replace('customer-brand.css?v=20260815-2','customer-brand.css?v=20260815-3')
              s=s.replace('customer-brand.js?v=20260815-2','customer-brand.js?v=20260815-3')
              p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-logo-layout-once.yml
          git add customer-brand.css index.html karte.html cancel.html
          git commit -m "Fix corrected logo display and cache versions"
          git push
