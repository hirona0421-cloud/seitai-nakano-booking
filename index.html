<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>整体なかの｜オンライン予約</title>

<style>
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{
  margin:0;
  background:#f6f3ee;
  color:#2f2d2a;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;
}
main{
  max-width:580px;
  margin:auto;
  padding:22px 14px 80px;
}
h1{margin:0;font-size:26px;letter-spacing:.02em}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 8px}
p{line-height:1.7}
.muted{color:#77716a;font-size:13px;line-height:1.65}
.required{color:#9b4138;font-size:12px;margin-left:5px}
.optional{color:#77716a;font-size:12px;margin-left:5px}
.hidden{display:none!important}

.header{margin-bottom:18px}
.subtitle{margin:5px 0 0;color:#77716a;font-size:14px}

.lineBox{
  margin-top:14px;
  background:#fff;
  border:1px solid #e7e0d7;
  border-radius:14px;
  padding:11px 13px;
  font-size:13px;
  line-height:1.6;
}

.card{
  background:#fff;
  border:1px solid #e7e0d7;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}

.step{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:25px;
  height:25px;
  margin-right:7px;
  border-radius:50%;
  background:#61574d;
  color:#fff;
  font-size:13px;
}

.menu,.slot{
  border:1px solid #e7e0d7;
  border-radius:13px;
  background:#fff;
  font:inherit;
  color:inherit;
}
.menu{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:14px;
  margin-bottom:8px;
  text-align:left;
}
.menuName{font-weight:700}
.menuSub{font-size:12px;color:#77716a;margin-top:3px}
.menuPrice{font-weight:700;white-space:nowrap}
.menu.active,.slot.active{
  background:#eee7df;
  border-color:#61574d;
  box-shadow:0 0 0 1px #61574d inset;
}

.slots{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
.slot{padding:13px 5px;font-weight:700}

input,textarea,select,button{font:inherit;max-width:100%}
input,textarea,select{
  width:100%;
  min-width:0;
  border:1px solid #e7e0d7;
  border-radius:12px;
  background:#fff;
  padding:13px;
  margin-top:6px;
  color:#2f2d2a;
}
input[type="date"]{
  -webkit-appearance:none;
  appearance:none;
  height:49px;
  min-height:49px;
}
input[type="date"]::-webkit-date-and-time-value{text-align:left}
textarea{min-height:95px;resize:vertical}
label{
  display:block;
  margin-top:13px;
  font-size:13px;
  font-weight:700;
}

.primary,.secondary,.danger{
  width:100%;
  border-radius:13px;
  padding:14px;
  font-weight:700;
  margin-top:10px;
}
.primary{
  background:#61574d;
  border:1px solid #61574d;
  color:#fff;
}
.secondary{
  background:#fff;
  border:1px solid #cfc6bc;
  color:#49443f;
}
.danger{
  background:#fff;
  border:1px solid #d8aaa5;
  color:#9b4138;
}
button:disabled{opacity:.55}

.msg{
  font-size:13px;
  line-height:1.65;
  margin-top:10px;
  color:#8a433b;
}

.summary{
  border:1px solid #e7e0d7;
  border-radius:14px;
  overflow:hidden;
  margin-top:12px;
}
.summaryRow{
  display:grid;
  grid-template-columns:100px 1fr;
  gap:10px;
  padding:11px 12px;
  border-bottom:1px solid #eee7df;
}
.summaryRow:last-child{border-bottom:0}
.summaryKey{font-size:12px;color:#77716a}
.summaryValue{font-size:14px;font-weight:600;overflow-wrap:anywhere}

.success{
  background:#edf4ee;
  border:1px solid #cbdccb;
  border-radius:18px;
  padding:20px;
}
.successTitle{
  font-size:21px;
  font-weight:700;
  margin-bottom:12px;
}
.successNote{
  margin-top:14px;
  padding-top:13px;
  border-top:1px solid #cbdccb;
  font-size:13px;
  line-height:1.7;
  color:#586258;
}

.manageBanner{
  background:#fff;
  border:1px solid #e7e0d7;
  border-radius:14px;
  padding:13px;
  margin-bottom:14px;
}
.manageBanner a{
  color:#554b42;
  font-weight:700;
}

.notice{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#faf8f5;
  font-size:12px;
  line-height:1.7;
  color:#706a64;
}

.cancelled{
  padding:14px;
  border-radius:12px;
  background:#f6efed;
  color:#81564f;
  line-height:1.7;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}
.actions button{margin-top:0}

@media(max-width:420px){
  .summaryRow{grid-template-columns:82px 1fr}
  .actions{grid-template-columns:1fr}
}
</style>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>
<main>

<header class="header">
  <h1>整体なかの</h1>
  <p class="subtitle">オンライン予約</p>

  <div id="lineStatus" class="lineBox">
    LINEとの連携を確認しています…
  </div>
</header>


<div id="latestManage" class="manageBanner hidden">
  予約済みの内容を確認・変更する場合は
  <a id="latestManageLink" href="#">こちら</a>
</div>


<div id="bookingArea">

<section class="card">
  <h2><span class="step">1</span>メニューを選択</h2>
  <div id="menus">
    <span class="muted">メニューを読み込んでいます…</span>
  </div>
</section>


<section class="card">
  <h2><span class="step">2</span>日付を選択</h2>
  <input type="date" id="date">
</section>


<section class="card">
  <h2><span class="step">3</span>時間を選択</h2>
  <p class="muted">
    ご予約いただける時間のみ表示されます。
  </p>

  <div id="slots" class="slots">
    <span class="muted">メニューと日付を選択してください。</span>
  </div>
</section>


<section class="card">
  <h2><span class="step">4</span>お客様情報</h2>

  <label>
    お名前
    <span class="required">必須</span>
    <input id="name" autocomplete="name" placeholder="例：中野 太郎">
  </label>

  <label>
    電話番号
    <span class="required">必須</span>
    <input
      id="tel"
      type="tel"
      inputmode="tel"
      autocomplete="tel"
      placeholder="例：09012345678"
    >
  </label>

  <label>
    気になる症状・部位
    <span class="optional">任意</span>
    <textarea
      id="memo"
      placeholder="例：首・肩のこり、腰の重さなど"
    ></textarea>
  </label>

  <div class="notice">
    ご入力いただいた情報は、ご予約管理およびご連絡のために使用します。
  </div>

  <button class="primary" id="confirmBooking">
    予約内容を確認する
  </button>

  <div id="msg" class="msg"></div>
</section>


<section id="confirmCard" class="card hidden">
  <h2>予約内容の確認</h2>

  <p class="muted">
    内容をご確認のうえ、予約を確定してください。
  </p>

  <div id="confirmSummary" class="summary"></div>

  <button class="primary" id="book">
    この内容で予約する
  </button>

  <button class="secondary" id="backToEdit">
    内容を修正する
  </button>

  <div id="confirmMsg" class="msg"></div>
</section>

</div>


<section id="successArea" class="success hidden">

  <div class="successTitle">
    ご予約が確定しました
  </div>

  <div id="successDetail" class="summary"></div>

  <div id="successLineText" class="successNote">
    予約内容をLINEでお送りします。
  </div>

  <a id="manageLink" href="#">
    <button class="secondary" type="button">
      予約内容の確認・変更・キャンセル
    </button>
  </a>

  <button id="newBooking" class="secondary" type="button">
    別の予約をする
  </button>

</section>


<section id="manageArea" class="hidden">

  <section class="card">

    <h2>ご予約内容</h2>

    <div id="manageLoading" class="muted">
      ご予約内容を確認しています…
    </div>

    <div id="manageContent" class="hidden">

      <div id="manageSummary" class="summary"></div>

      <div id="manageCancelled" class="cancelled hidden">
        このご予約はキャンセル済みです。
      </div>

      <div id="manageActions" class="actions">
        <button class="secondary" id="openManageEdit">
          予約を変更
        </button>

        <button class="danger" id="cancelCustomerBooking">
          予約をキャンセル
        </button>
      </div>

    </div>

    <div id="manageError" class="msg"></div>

  </section>


  <section id="manageEditCard" class="card hidden">

    <h2>予約を変更</h2>

    <label>
      メニュー
      <select id="manageMenu"></select>
    </label>

    <label>
      日付
      <input type="date" id="manageDate">
    </label>

    <label>
      時間
      <select id="manageTime">
        <option value="">時間を選択</option>
      </select>
    </label>

    <button class="primary" id="saveManageEdit">
      この内容に変更する
    </button>

    <button class="secondary" id="closeManageEdit">
      変更をやめる
    </button>

    <div id="manageEditMsg" class="msg"></div>

  </section>


  <a href="./">
    <button class="secondary" type="button">
      新しく予約する
    </button>
  </a>

</section>


<script type="module">

import {createClient}
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase=createClient(
  'https://scjzofjyxmchfjsngqtb.supabase.co',
  'sb_publishable_EGlr-6w0xh4gD8OImboE_Q_V-COJ7t9'
);

const LIFF_ID='2011071292-KT8sSyCN';

const BASE_URL=
  'https://seitai-nakano.github.io/seitai-nakano-booking/';

const $=id=>document.getElementById(id);

let menus=[];
let selectedMenu=null;
let selectedTime=null;
let lineUser=null;
let bookingInProgress=false;
let manageBooking=null;

const params=new URLSearchParams(location.search);
const manageToken=params.get('manage');

function esc(value){
  return String(value??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function todayJapan(){
  const parts=
    new Intl.DateTimeFormat('en-US',{
      timeZone:'Asia/Tokyo',
      year:'numeric',
      month:'2-digit',
      day:'2-digit'
    }).formatToParts(new Date());

  const y=parts.find(x=>x.type==='year').value;
  const m=parts.find(x=>x.type==='month').value;
  const d=parts.find(x=>x.type==='day').value;

  return `${y}-${m}-${d}`;
}

function currentJapanMinutes(){
  const parts=
    new Intl.DateTimeFormat('en-US',{
      timeZone:'Asia/Tokyo',
      hour:'2-digit',
      minute:'2-digit',
      hourCycle:'h23'
    }).formatToParts(new Date());

  const h=Number(parts.find(x=>x.type==='hour').value);
  const m=Number(parts.find(x=>x.type==='minute').value);

  return h*60+m;
}

function isPastSlot(date,time){
  if(date!==todayJapan()) return false;

  const [h,m]=String(time).slice(0,5).split(':').map(Number);

  return h*60+m<=currentJapanMinutes();
}

function formatDate(date){
  if(!date) return '';

  const [y,m,d]=date.split('-').map(Number);

  const dt=new Date(Date.UTC(y,m-1,d));

  return new Intl.DateTimeFormat(
    'ja-JP',
    {
      timeZone:'UTC',
      month:'numeric',
      day:'numeric',
      weekday:'short'
    }
  ).format(dt);
}

function yen(value){
  return `${Number(value||0).toLocaleString()}円`;
}

function summaryHtml(rows){
  return rows.map(([key,value])=>`
    <div class="summaryRow">
      <div class="summaryKey">${esc(key)}</div>
      <div class="summaryValue">${esc(value)}</div>
    </div>
  `).join('');
}

function phoneIsValid(value){
  const digits=value.replace(/\D/g,'');
  return digits.length===10 || digits.length===11;
}

function setLatestManage(token){
  if(!token) return;

  localStorage.setItem(
    'nakano_latest_manage_token',
    token
  );

  const url=
    `${BASE_URL}?manage=${encodeURIComponent(token)}`;

  $('latestManageLink').href=url;
  $('latestManage').classList.remove('hidden');
}

function loadLatestManage(){
  if(manageToken) return;

  const token=
    localStorage.getItem(
      'nakano_latest_manage_token'
    );

  if(token){
    setLatestManage(token);
  }
}

async function initLine(){

  if(manageToken){
    $('lineStatus').textContent=
      'ご予約内容の確認・変更ができます。';
    return null;
  }

  try{

    if(!window.liff){
      throw new Error('LIFF SDK not loaded');
    }

    await window.liff.init({
      liffId:LIFF_ID
    });

    if(!window.liff.isLoggedIn()){

      $('lineStatus').textContent=
        'LINE連携のためログイン画面へ移動します…';

      window.liff.login({
        redirectUri:BASE_URL
      });

      return null;
    }

    const profile=
      await window.liff.getProfile();

    lineUser={
      userId:profile.userId,
      displayName:profile.displayName||''
    };

    $('lineStatus').textContent=
      'LINEで予約完了のお知らせを受け取れます。';

    return lineUser;

  }catch(error){

    console.error('LINE連携エラー',error);

    $('lineStatus').textContent=
      'オンライン予約をご利用いただけます。';

    return null;
  }
}

const lineReadyPromise=initLine();

async function loadMenus(){

  const {data,error}=
    await supabase
      .from('nakano_menus')
      .select('*')
      .eq('is_active',true)
      .order('display_order');

  if(error){
    console.error(error);
    $('menus').innerHTML=
      '<span class="muted">メニューを読み込めませんでした。時間をおいて再度お試しください。</span>';
    return;
  }

  menus=data||[];

  if(!manageToken){

    $('menus').innerHTML='';

    menus.forEach(menu=>{

      const button=document.createElement('button');
      button.className='menu';

      button.innerHTML=`
        <div>
          <div class="menuName">${esc(menu.name)}</div>
          ${
            menu.minutes
            ? `<div class="menuSub">${Number(menu.minutes)}分</div>`
            : ''
          }
        </div>
        <div class="menuPrice">${yen(menu.price)}</div>
      `;

      button.onclick=()=>{

        if(bookingInProgress) return;

        document
          .querySelectorAll('.menu')
          .forEach(x=>x.classList.remove('active'));

        button.classList.add('active');

        selectedMenu=menu;
        selectedTime=null;

        loadSlots();
      };

      $('menus').appendChild(button);
    });

  }

  $('manageMenu').innerHTML=
    '<option value="">メニューを選択</option>'+
    menus.map(menu=>`
      <option value="${esc(menu.id)}">
        ${esc(menu.name)}　${yen(menu.price)}
      </option>
    `).join('');
}

async function getAvailableSlots(menuId,date){

  if(!menuId || !date) return [];

  const {data,error}=
    await supabase.rpc(
      'nakano_available_slots',
      {
        p_date:date,
        p_menu_id:menuId
      }
    );

  if(error){
    console.error(error);
    return [];
  }

  return (data||[])
    .filter(slot=>
      !isPastSlot(
        date,
        slot.start_time
      )
    );
}

async function loadSlots(){

  const box=$('slots');

  box.innerHTML='';
  selectedTime=null;

  if(!selectedMenu || !$('date').value){
    box.innerHTML=
      '<span class="muted">メニューと日付を選択してください。</span>';
    return;
  }

  box.innerHTML=
    '<span class="muted">空き時間を確認しています…</span>';

  const slots=
    await getAvailableSlots(
      selectedMenu.id,
      $('date').value
    );

  box.innerHTML='';

  if(!slots.length){
    box.innerHTML=
      '<span class="muted">この日は現在ご予約いただける時間がありません。</span>';
    return;
  }

  slots.forEach(slot=>{

    const button=document.createElement('button');
    button.className='slot';

    button.textContent=
      String(slot.start_time).slice(0,5);

    button.onclick=()=>{

      document
        .querySelectorAll('.slot')
        .forEach(x=>x.classList.remove('active'));

      button.classList.add('active');

      selectedTime=slot.start_time;
    };

    box.appendChild(button);
  });
}

$('date').min=todayJapan();
$('manageDate').min=todayJapan();

$('date').onchange=()=>{
  selectedTime=null;
  loadSlots();
};

$('confirmBooking').onclick=()=>{

  const name=$('name').value.trim();
  const tel=$('tel').value.trim();
  const memo=$('memo').value.trim();

  $('msg').textContent='';

  if(!selectedMenu){
    $('msg').textContent=
      'メニューを選択してください。';
    return;
  }

  if(!$('date').value){
    $('msg').textContent=
      '日付を選択してください。';
    return;
  }

  if(!selectedTime){
    $('msg').textContent=
      '時間を選択してください。';
    return;
  }

  if(!name){
    $('msg').textContent=
      'お名前を入力してください。';
    return;
  }

  if(!phoneIsValid(tel)){
    $('msg').textContent=
      '電話番号を確認してください。';
    return;
  }

  $('confirmSummary').innerHTML=
    summaryHtml([
      ['メニュー',selectedMenu.name],
      [
        '日時',
        `${formatDate($('date').value)} ${String(selectedTime).slice(0,5)}`
      ],
      ['料金',yen(selectedMenu.price)],
      ['お名前',name],
      ['電話番号',tel],
      ['症状・部位',memo||'未入力']
    ]);

  $('confirmCard').classList.remove('hidden');

  $('confirmCard').scrollIntoView({
    behavior:'smooth',
    block:'start'
  });
};

$('backToEdit').onclick=()=>{
  $('confirmCard').classList.add('hidden');

  $('bookingArea').scrollIntoView({
    behavior:'smooth',
    block:'start'
  });
};

$('book').onclick=async()=>{

  if(bookingInProgress) return;

  const name=$('name').value.trim();
  const tel=$('tel').value.trim();
  const memo=$('memo').value.trim();

  if(
    !selectedMenu ||
    !$('date').value ||
    !selectedTime ||
    !name ||
    !phoneIsValid(tel)
  ){
    $('confirmMsg').textContent=
      '入力内容をもう一度確認してください。';
    return;
  }

  const bookingDate=$('date').value;
  const bookingTime=selectedTime;
  const bookingMenu=selectedMenu;

  bookingInProgress=true;
  $('book').disabled=true;
  $('backToEdit').disabled=true;
  $('book').textContent='予約を確定しています…';
  $('confirmMsg').textContent='';

  try{

    if(!lineUser){
      lineUser=await lineReadyPromise;
    }

    if(
      !lineUser &&
      window.liff?.isLoggedIn()
    ){
      try{
        const profile=
          await window.liff.getProfile();

        lineUser={
          userId:profile.userId,
          displayName:profile.displayName||''
        };
      }catch(error){
        console.error(error);
      }
    }

    const {
      data:bookingId,
      error:createError
    }=
      await supabase.rpc(
        'nakano_create_booking',
        {
          p_date:bookingDate,
          p_start_time:bookingTime,
          p_menu_id:bookingMenu.id,
          p_customer_name:name,
          p_phone:tel,
          p_memo:memo||null
        }
      );

    if(createError){
      console.error(createError);

      $('confirmMsg').textContent=
        '申し訳ありません。この時間は予約できなくなりました。空き時間をもう一度お選びください。';

      await loadSlots();
      return;
    }

    if(
      bookingId &&
      lineUser?.userId
    ){
      const {error:lineError}=
        await supabase.rpc(
          'nakano_attach_line_to_booking',
          {
            p_booking_id:bookingId,
            p_line_user_id:lineUser.userId,
            p_line_display_name:lineUser.displayName||null
          }
        );

      if(lineError){
        console.error('LINE保存エラー',lineError);
      }
    }

    let token=null;

    const {
      data:tokenData,
      error:tokenError
    }=
      await supabase.rpc(
        'nakano_customer_get_manage_token',
        {
          p_booking_id:bookingId,
          p_phone:tel
        }
      );

    if(!tokenError && tokenData){
      token=tokenData;
      setLatestManage(token);
    }

    try{
      const {error:notifyError}=
        await supabase.functions.invoke(
          'nakano-booking-notify',
          {
            body:{
              booking_date:bookingDate,
              start_time:bookingTime,
              menu_name:bookingMenu.name,
              customer_name:name,
              phone:tel,
              memo:memo||null
            }
          }
        );

      if(notifyError){
        console.error('通知エラー',notifyError);
      }
    }catch(error){
      console.error('通知エラー',error);
    }

    $('successDetail').innerHTML=
      summaryHtml([
        ['メニュー',bookingMenu.name],
        [
          '日時',
          `${formatDate(bookingDate)} ${String(bookingTime).slice(0,5)}`
        ],
        ['料金',yen(bookingMenu.price)],
        ['お名前',name]
      ]);

    const tomorrow=new Date();
    tomorrow.setDate(tomorrow.getDate()+1);

    const tomorrowParts=
      new Intl.DateTimeFormat('en-US',{
        timeZone:'Asia/Tokyo',
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }).formatToParts(tomorrow);

    const tomorrowDate=
      `${
        tomorrowParts.find(x=>x.type==='year').value
      }-${
        tomorrowParts.find(x=>x.type==='month').value
      }-${
        tomorrowParts.find(x=>x.type==='day').value
      }`;

    if(
      bookingDate===tomorrowDate &&
      currentJapanMinutes()>=22*60
    ){
      $('successLineText').textContent=
        '明日のご予約を承りました。予約内容はLINEでもお送りします。';
    }else{
      $('successLineText').textContent=
        '予約内容をLINEでお送りします。前日にもご案内をお送りします。';
    }

    if(token){
      $('manageLink').href=
        `${BASE_URL}?manage=${encodeURIComponent(token)}`;

      $('manageLink').classList.remove('hidden');
    }else{
      $('manageLink').classList.add('hidden');
    }

    $('bookingArea').classList.add('hidden');
    $('successArea').classList.remove('hidden');

    $('successArea').scrollIntoView({
      behavior:'smooth',
      block:'start'
    });

  }catch(error){

    console.error(error);

    $('confirmMsg').textContent=
      '予約処理中にエラーが発生しました。もう一度お試しください。';

  }finally{

    bookingInProgress=false;
    $('book').disabled=false;
    $('backToEdit').disabled=false;
    $('book').textContent='この内容で予約する';
  }
};

$('newBooking').onclick=()=>{

  selectedMenu=null;
  selectedTime=null;

  $('name').value='';
  $('tel').value='';
  $('memo').value='';
  $('date').value='';

  document
    .querySelectorAll('.menu,.slot')
    .forEach(x=>x.classList.remove('active'));

  $('slots').innerHTML=
    '<span class="muted">メニューと日付を選択してください。</span>';

  $('confirmCard').classList.add('hidden');
  $('successArea').classList.add('hidden');
  $('bookingArea').classList.remove('hidden');

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });
};


async function loadManageBooking(){

  if(!manageToken) return;

  localStorage.setItem(
    'nakano_latest_manage_token',
    manageToken
  );

  $('bookingArea').classList.add('hidden');
  $('successArea').classList.add('hidden');
  $('latestManage').classList.add('hidden');
  $('manageArea').classList.remove('hidden');

  const {
    data,
    error
  }=
    await supabase.rpc(
      'nakano_customer_get_booking',
      {
        p_token:manageToken
      }
    );

  $('manageLoading').classList.add('hidden');

  if(error || !data){

    console.error(error);

    $('manageError').textContent=
      'ご予約を確認できませんでした。URLをご確認ください。';

    return;
  }

  manageBooking=data;

  renderManageBooking();
}

function renderManageBooking(){

  if(!manageBooking) return;

  $('manageContent').classList.remove('hidden');

  $('manageSummary').innerHTML=
    summaryHtml([
      ['メニュー',manageBooking.menu_name],
      [
        '日時',
        `${formatDate(manageBooking.booking_date)} ${String(manageBooking.start_time).slice(0,5)}`
      ],
      ['料金',yen(manageBooking.price)],
      ['お名前',manageBooking.customer_name],
      ['電話番号',manageBooking.phone],
      ['症状・部位',manageBooking.memo||'未入力']
    ]);

  const cancelled=
    manageBooking.status!=='confirmed';

  $('manageCancelled')
    .classList
    .toggle('hidden',!cancelled);

  $('manageActions')
    .classList
    .toggle('hidden',cancelled);

  $('manageEditCard')
    .classList
    .add('hidden');
}

$('openManageEdit').onclick=async()=>{

  if(!manageBooking) return;

  $('manageMenu').value=
    manageBooking.menu_id;

  $('manageDate').value=
    manageBooking.booking_date;

  $('manageEditMsg').textContent='';

  await loadManageTimes();

  $('manageEditCard').classList.remove('hidden');

  $('manageEditCard').scrollIntoView({
    behavior:'smooth',
    block:'start'
  });
};

async function loadManageTimes(){

  if(!manageBooking) return;

  const menuId=$('manageMenu').value;
  const date=$('manageDate').value;
  const select=$('manageTime');

  select.innerHTML=
    '<option value="">時間を選択</option>';

  if(!menuId || !date) return;

  let slots=
    await getAvailableSlots(
      menuId,
      date
    );

  const currentTime=
    String(manageBooking.start_time);

  const same=
    date===manageBooking.booking_date &&
    menuId===manageBooking.menu_id;

  if(
    same &&
    !slots.some(
      x=>String(x.start_time)===currentTime
    )
  ){
    slots.push({
      start_time:currentTime
    });
  }

  slots.sort(
    (a,b)=>
      String(a.start_time)
        .localeCompare(
          String(b.start_time)
        )
  );

  slots.forEach(slot=>{

    const option=document.createElement('option');

    option.value=slot.start_time;
    option.textContent=
      String(slot.start_time).slice(0,5);

    if(
      same &&
      String(slot.start_time)===currentTime
    ){
      option.selected=true;
    }

    select.appendChild(option);
  });
}

$('manageMenu').onchange=loadManageTimes;
$('manageDate').onchange=loadManageTimes;

$('closeManageEdit').onclick=()=>{
  $('manageEditCard').classList.add('hidden');
};

$('saveManageEdit').onclick=async()=>{

  if(!manageBooking) return;

  const menuId=$('manageMenu').value;
  const date=$('manageDate').value;
  const time=$('manageTime').value;

  $('manageEditMsg').textContent='';

  if(!menuId || !date || !time){
    $('manageEditMsg').textContent=
      'メニュー・日付・時間を選択してください。';
    return;
  }

  if(
    !confirm(
      'この内容に予約を変更しますか？'
    )
  ){
    return;
  }

  $('saveManageEdit').disabled=true;
  $('saveManageEdit').textContent='変更しています…';

  const {error}=
    await supabase.rpc(
      'nakano_customer_change_booking',
      {
        p_token:manageToken,
        p_date:date,
        p_start_time:time,
        p_menu_id:menuId
      }
    );

  $('saveManageEdit').disabled=false;
  $('saveManageEdit').textContent='この内容に変更する';

  if(error){

    console.error(error);

    $('manageEditMsg').textContent=
      '変更できませんでした。別の日時をお選びください。';

    await loadManageTimes();
    return;
  }

  const {data,error:getError}=
    await supabase.rpc(
      'nakano_customer_get_booking',
      {
        p_token:manageToken
      }
    );

  if(!getError && data){
    manageBooking=data;
  }

  renderManageBooking();

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });
};

$('cancelCustomerBooking').onclick=async()=>{

  if(!manageBooking) return;

  if(
    !confirm(
      `${formatDate(manageBooking.booking_date)} ${String(manageBooking.start_time).slice(0,5)}の予約をキャンセルしますか？`
    )
  ){
    return;
  }

  $('cancelCustomerBooking').disabled=true;
  $('cancelCustomerBooking').textContent='キャンセルしています…';

  const {error}=
    await supabase.rpc(
      'nakano_customer_cancel_booking',
      {
        p_token:manageToken
      }
    );

  $('cancelCustomerBooking').disabled=false;
  $('cancelCustomerBooking').textContent='予約をキャンセル';

  if(error){

    console.error(error);

    $('manageError').textContent=
      'キャンセルできませんでした。店舗までご連絡ください。';

    return;
  }

  const {data}=
    await supabase.rpc(
      'nakano_customer_get_booking',
      {
        p_token:manageToken
      }
    );

  if(data){
    manageBooking=data;
  }else{
    manageBooking.status='cancelled';
  }

  renderManageBooking();

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });
};


async function start(){

  loadLatestManage();

  await loadMenus();

  if(manageToken){
    await loadManageBooking();
  }
}

start();

</script>
