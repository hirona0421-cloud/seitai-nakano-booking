<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>整体なかの｜予約</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;
  margin:0;
  background:#f6f3ee;
  color:#2f2d2a;
}

main{
  max-width:560px;
  margin:auto;
  padding:18px 14px 80px;
}

.card{
  background:#fff;
  border:1px solid #e7e0d7;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}

h1{
  margin:0;
  font-size:25px;
}

h2{
  font-size:19px;
  margin:0 0 10px;
}

.muted{
  color:#77716a;
  font-size:13px;
  line-height:1.6;
}

.menu,
.slot{
  border:1px solid #e7e0d7;
  border-radius:12px;
  background:#fff;
  padding:13px;
  font:inherit;
}

.menu{
  width:100%;
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  text-align:left;
}

.menu.active,
.slot.active{
  background:#eee7df;
  border-color:#61574d;
}

.slots{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

input,
textarea{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  border:1px solid #e7e0d7;
  border-radius:12px;
  font:inherit;
  margin-top:6px;
  background:#fff;
}

textarea{
  min-height:90px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-top:12px;
}

.primary{
  width:100%;
  border:0;
  border-radius:13px;
  background:#61574d;
  color:#fff;
  padding:15px;
  font-weight:700;
  margin-top:16px;
  font:inherit;
}

.primary:disabled{
  opacity:.55;
}

.msg{
  font-size:13px;
  margin-top:12px;
  line-height:1.6;
}

.success{
  background:#eaf3ec;
  border:1px solid #cbdccb;
  padding:16px;
  border-radius:14px;
  margin-top:14px;
}

.successTitle{
  font-size:18px;
  font-weight:700;
  margin-bottom:10px;
}

.successDetail{
  line-height:1.8;
}

.notice{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #cbdccb;
  font-size:13px;
  color:#5f675f;
  line-height:1.6;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<main>

<h1>整体なかの</h1>
<p class="muted">オンライン予約</p>


<section class="card">

<h2>1. メニュー</h2>

<div id="menus">
  <span class="muted">読み込み中…</span>
</div>

</section>


<section class="card">

<h2>2. 日付</h2>

<input
  type="date"
  id="date"
>

</section>


<section class="card">

<h2>3. 空き時間</h2>

<p class="muted">
表示されている時間だけ予約できます。
</p>

<div
  id="slots"
  class="slots"
></div>

</section>


<section class="card">

<h2>4. お客様情報</h2>

<label>
お名前
<input id="name" autocomplete="name">
</label>

<label>
電話番号
<input
  id="tel"
  inputmode="tel"
  autocomplete="tel"
>
</label>

<label>
気になる症状・部位
<textarea id="memo"></textarea>
</label>

<button
  class="primary"
  id="book"
>
予約する
</button>

<div
  id="msg"
  class="msg"
></div>

<div
  id="successBox"
  class="success hidden"
>
  <div class="successTitle">
    予約を受け付けました
  </div>

  <div
    id="successDetail"
    class="successDetail"
  ></div>

  <div class="notice">
    ご予約内容の変更・キャンセルをご希望の場合は、
    店舗までご連絡ください。
  </div>
</div>

</section>


<script type="module">

import {
  createClient
}
from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


const supabase=createClient(
  'https://scjzofjyxmchfjsngqtb.supabase.co',
  'sb_publishable_EGlr-6w0xh4gD8OImboE_Q_V-COJ7t9'
);


let selectedMenu=null;
let selectedTime=null;
let bookingInProgress=false;


const dateEl=
  document.getElementById('date');

const bookButton=
  document.getElementById('book');

const msg=
  document.getElementById('msg');

const successBox=
  document.getElementById('successBox');

const successDetail=
  document.getElementById('successDetail');


dateEl.min=
  new Date()
  .toISOString()
  .slice(0,10);


async function loadMenus(){

  const r=
    await supabase
      .from('nakano_menus')
      .select('*')
      .eq('is_active',true)
      .order('display_order');


  const box=
    document.getElementById('menus');


  if(r.error){

    box.textContent=
      'メニューを読み込めませんでした';

    return;
  }


  box.innerHTML='';


  r.data.forEach(menu=>{

    const button=
      document.createElement('button');

    button.className='menu';

    button.innerHTML=
      `
      <span>${menu.name}</span>
      <strong>${Number(menu.price).toLocaleString()}円</strong>
      `;


    button.onclick=()=>{

      if(bookingInProgress){
        return;
      }

      document
        .querySelectorAll('.menu')
        .forEach(
          item=>
            item.classList.remove('active')
        );

      button
        .classList
        .add('active');

      selectedMenu=
        menu;

      hideSuccess();

      loadSlots();

    };


    box.appendChild(button);

  });

}


async function loadSlots(){

  const box=
    document.getElementById('slots');

  box.innerHTML='';

  selectedTime=null;


  if(
    !selectedMenu
    ||
    !dateEl.value
  ){

    box.innerHTML=
      '<span class="muted">メニューと日付を選択してください</span>';

    return;
  }


  const r=
    await supabase.rpc(
      'nakano_available_slots',
      {
        p_date:
          dateEl.value,

        p_menu_id:
          selectedMenu.id
      }
    );


  if(r.error){

    box.innerHTML=
      '<span class="muted">空き時間を読み込めませんでした</span>';

    return;
  }


  if(!r.data?.length){

    box.innerHTML=
      '<span class="muted">この日は予約可能な時間がありません</span>';

    return;
  }


  r.data.forEach(slot=>{

    const button=
      document.createElement('button');

    button.className='slot';

    button.textContent=
      String(
        slot.start_time
      )
      .slice(0,5);


    button.onclick=()=>{

      if(bookingInProgress){
        return;
      }

      document
        .querySelectorAll('.slot')
        .forEach(
          item=>
            item.classList.remove('active')
        );

      button
        .classList
        .add('active');

      selectedTime=
        slot.start_time;

      hideSuccess();

    };


    box.appendChild(button);

  });

}


function hideSuccess(){

  successBox
    .classList
    .add('hidden');

}


dateEl.onchange=()=>{

  if(bookingInProgress){
    return;
  }

  hideSuccess();

  loadSlots();

};


bookButton.onclick=async()=>{

  if(bookingInProgress){
    return;
  }


  const name=
    document
      .getElementById('name')
      .value
      .trim();


  const tel=
    document
      .getElementById('tel')
      .value
      .trim();


  const memo=
    document
      .getElementById('memo')
      .value
      .trim();


  hideSuccess();


  if(
    !selectedMenu
    ||
    !dateEl.value
    ||
    !selectedTime
    ||
    !name
    ||
    !tel
  ){

    msg.textContent=
      'メニュー・日付・時間・お名前・電話番号を入力してください。';

    return;
  }


  const bookingDate=
    dateEl.value;

  const bookingTime=
    selectedTime;

  const bookingMenu=
    selectedMenu;


  bookingInProgress=true;

  bookButton.disabled=true;

  bookButton.textContent=
    '予約を送信しています…';

  msg.textContent='';


  try{

    const r=
      await supabase.rpc(
        'nakano_create_booking',
        {
          p_date:
            bookingDate,

          p_start_time:
            bookingTime,

          p_menu_id:
            bookingMenu.id,

          p_customer_name:
            name,

          p_phone:
            tel,

          p_memo:
            memo||null
        }
      );


    if(r.error){

      msg.textContent=
        '予約できませんでした。空き状況をもう一度確認してください。';

      await loadSlots();

      return;

    }


    successDetail.innerHTML=
      `
      <strong>${bookingMenu.name}</strong><br>
      ${bookingDate}<br>
      ${String(bookingTime).slice(0,5)}<br>
      ${name} 様
      `;


    successBox
      .classList
      .remove('hidden');


    successBox
      .scrollIntoView({
        behavior:'smooth',
        block:'center'
      });


    try{

      const {
        error:notifyError
      }=
      await supabase.functions.invoke(
        'nakano-booking-notify',
        {
          body:{
            booking_date:
              bookingDate,

            start_time:
              bookingTime,

            menu_name:
              bookingMenu.name,

            customer_name:
              name,

            phone:
              tel,

            memo:
              memo||null
          }
        }
      );


      if(notifyError){

        console.error(
          '通知送信エラー',
          notifyError
        );

      }

    }
    catch(error){

      console.error(
        '通知処理エラー',
        error
      );

    }


    document
      .getElementById('name')
      .value='';

    document
      .getElementById('tel')
      .value='';

    document
      .getElementById('memo')
      .value='';


    await loadSlots();

  }
  finally{

    bookingInProgress=false;

    bookButton.disabled=false;

    bookButton.textContent=
      '予約する';

  }

};


loadMenus();

</script>

</main>

    await liff.init({
      liffId: "2011071292-KT8sSyCN"
    });

      liff.login({
        redirectUri: window.location.href

  } catch (error) {

  }
})();
</script>
</body>
</html>
