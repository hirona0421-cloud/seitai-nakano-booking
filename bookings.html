<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>整体なかの｜予約一覧</title>

<style>
*{box-sizing:border-box}

html,body{
  max-width:100%;
  overflow-x:hidden
}

body{
  margin:0;
  background:#f6f3ee;
  color:#2f2d2a;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif
}

main{
  max-width:820px;
  margin:auto;
  padding:16px 12px 80px
}

h1{
  margin:0;
  font-size:24px
}

h2{
  margin:0 0 10px;
  font-size:19px
}

p{
  line-height:1.6
}

a{
  text-decoration:none
}

.hidden{
  display:none!important
}

.muted{
  color:#77716a;
  font-size:13px;
  line-height:1.6
}

.card{
  background:#fff;
  border:1px solid #e7e0d7;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px
}

input,
select,
textarea,
button{
  font:inherit;
  max-width:100%
}

input,
select,
textarea{
  display:block;
  width:100%;
  min-width:0;
  padding:13px;
  border:1px solid #e7e0d7;
  border-radius:12px;
  margin:6px 0 10px;
  background:#fff
}

textarea{
  min-height:85px;
  resize:vertical
}

input[type="date"]{
  -webkit-appearance:none;
  appearance:none;
  height:48px
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-top:8px
}

.primary,
.secondary,
.danger{
  width:100%;
  border-radius:13px;
  padding:13px;
  font-weight:700
}

.primary{
  background:#61574d;
  color:#fff;
  border:1px solid #61574d
}

.secondary{
  background:#fff;
  color:#49443f;
  border:1px solid #ddd5cc
}

.danger{
  background:#fff;
  color:#9b4138;
  border:1px solid #d8aaa5
}

button:disabled{
  opacity:.55
}

.msg{
  margin-top:8px;
  font-size:13px;
  line-height:1.6;
  color:#8a433b
}


/* ==========================
   上部ナビ
========================== */

.topLinks{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px
}

.topLinks button{
  margin:0
}


/* ==========================
   日付操作
========================== */

.dateControls{
  display:grid;
  grid-template-columns:70px 1fr 70px;
  gap:7px;
  align-items:center
}

.dateControls button{
  min-height:48px;
  padding:8px
}

.todayButton{
  margin-top:8px
}

.dateTitle{
  margin-top:12px;
  font-size:18px;
  font-weight:800
}


/* ==========================
   横型スケジュール
========================== */

.timelineScroll{
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:8px;
  margin-top:12px
}

.timeline{
  position:relative;
  min-width:1740px;
  height:144px;
  background:#faf8f5;
  border:1px solid #e7e0d7;
  border-radius:14px;
  overflow:hidden
}

.timeHeader{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:35px
}

.timeMark{
  position:absolute;
  top:0;
  height:35px;
  border-left:1px solid #ddd5cc;
  padding:4px 0 0 4px;
  font-size:11px;
  color:#77716a;
  white-space:nowrap
}

.lane{
  position:absolute;
  left:0;
  right:0;
  top:35px;
  height:109px
}

.slotBackground{
  position:absolute;
  top:0;
  height:109px;
  border-left:1px solid #e9e3dc
}

.slotOpen{
  background:#f1f7f2
}

.slotClosed{
  background:#efeeec
}

.blockedBlock{
  position:absolute;
  top:9px;
  height:91px;
  border-radius:10px;
  background:#f3deda;
  border:1px solid #dca9a2;
  padding:8px;
  overflow:hidden;
  font-size:11px;
  color:#884e47;
  z-index:3
}

.bookingBlock{
  position:absolute;
  top:9px;
  height:91px;
  border-radius:10px;
  background:#fff;
  border:2px solid #9a8b7b;
  padding:8px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  z-index:5;
  cursor:pointer;
  touch-action:pan-x
}

.bookingBlock:active{
  transform:scale(.99)
}

.bookingTime{
  font-size:11px;
  color:#77716a;
  white-space:nowrap
}

.bookingName{
  font-size:14px;
  font-weight:800;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.bookingMenu{
  font-size:11px;
  margin-top:4px;
  line-height:1.3;
  overflow:hidden
}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:10px;
  font-size:12px;
  color:#6e6862
}

.legendItem{
  display:flex;
  align-items:center;
  gap:5px
}

.legendDot{
  width:13px;
  height:13px;
  border-radius:4px;
  border:1px solid #d9d1c8
}

.legendOpen{
  background:#f1f7f2
}

.legendBooking{
  background:#fff;
  border:2px solid #9a8b7b
}

.legendBlocked{
  background:#f3deda
}

.legendClosed{
  background:#efeeec
}


/* ==========================
   予約一覧
========================== */

.bookingItem{
  padding:14px 0;
  border-bottom:1px solid #eee7df
}

.bookingItem:last-child{
  border-bottom:0
}

.bookingItemTop{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px
}

.bookingItemTime{
  font-size:18px;
  font-weight:800
}

.bookingItemMenu{
  margin-top:3px;
  font-size:14px;
  font-weight:700
}

.bookingItemName{
  margin-top:5px;
  font-size:14px
}

.bookingItemMemo{
  margin-top:4px;
  font-size:12px;
  color:#77716a;
  line-height:1.5
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:9px
}

.actions button{
  width:auto;
  padding:8px 12px;
  border-radius:10px
}


/* ==========================
   編集
========================== */

.editingSummary{
  padding:12px;
  background:#faf8f5;
  border-radius:12px;
  margin-bottom:12px;
  line-height:1.6
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}


@media(max-width:520px){

  main{
    padding-left:9px;
    padding-right:9px
  }

  .topLinks{
    grid-template-columns:1fr 1fr
  }

  .row{
    grid-template-columns:1fr
  }

  .timeline{
    min-width:1740px
  }

}
</style>
</head>

<body>

<main>

<h1>整体なかの</h1>
<p class="muted">予約一覧・スケジュール</p>


<section class="card" id="loginCard">

<h2>管理者ログイン</h2>

<input
  id="email"
  type="email"
  placeholder="メールアドレス"
  autocomplete="email"
>

<input
  id="password"
  type="password"
  placeholder="パスワード"
  autocomplete="current-password"
>

<button class="primary" id="login">
ログイン
</button>

<div id="loginMsg" class="msg"></div>

</section>


<div id="adminArea" class="hidden">


<section class="card">

<div class="topLinks">

<a href="./admin.html">
<button class="secondary" type="button">
管理トップ
</button>
</a>

<a href="./customers.html">
<button class="secondary" type="button">
顧客・カルテ
</button>
</a>

</div>

</section>


<section class="card">

<h2>日付</h2>

<div class="dateControls">

<button class="secondary" id="prevDay">
前日
</button>

<input
  id="date"
  type="date"
>

<button class="secondary" id="nextDay">
翌日
</button>

</div>

<button class="secondary todayButton" id="today">
今日を表示
</button>

<div id="dateTitle" class="dateTitle"></div>

</section>


<section class="card">

<h2>スケジュール</h2>

<p class="muted">
スマホでは左右にスライドできます。予約をタップすると詳細・変更画面が開きます。
</p>

<div
  class="timelineScroll"
  id="timelineScroll"
>

<div class="timeline">

<div
  id="timeHeader"
  class="timeHeader"
></div>

<div
  id="lane"
  class="lane"
></div>

</div>

</div>


<div class="legend">

<div class="legendItem">
<span class="legendDot legendOpen"></span>
空き
</div>

<div class="legendItem">
<span class="legendDot legendBooking"></span>
予約
</div>

<div class="legendItem">
<span class="legendDot legendBlocked"></span>
予約不可
</div>

<div class="legendItem">
<span class="legendDot legendClosed"></span>
CLOSE
</div>

</div>

<div id="scheduleMsg" class="msg"></div>

</section>


<section class="card">

<h2>この日の予約</h2>

<div id="bookingCount" class="muted"></div>

<div id="bookingList"></div>

</section>


<section
  id="editCard"
  class="card hidden"
>

<h2>予約詳細・変更</h2>

<div
  id="editingSummary"
  class="editingSummary"
></div>


<label>予約日</label>

<input
  id="editDate"
  type="date"
>


<label>メニュー</label>

<select id="editMenu">
<option value="">メニューを選択</option>
</select>


<label>時間</label>

<select id="editTime">
<option value="">時間を選択</option>
</select>


<label>お客様名</label>

<input id="editName">


<label>電話番号</label>

<input
  id="editPhone"
  inputmode="tel"
>


<label>症状・メモ</label>

<textarea id="editMemo"></textarea>


<button class="primary" id="saveEdit">
変更を保存
</button>

<button class="secondary" id="closeEdit">
変更をやめる
</button>

<button class="danger" id="cancelBooking">
この予約をキャンセル
</button>

<div id="editMsg" class="msg"></div>

</section>


</div>


<script type="module">

import {createClient}
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


const supabase=
createClient(
  'https://scjzofjyxmchfjsngqtb.supabase.co',
  'sb_publishable_EGlr-6w0xh4gD8OImboE_Q_V-COJ7t9'
);


const $=
id=>document.getElementById(id);


/* ==========================
   時間設定
========================== */

const DAY_START=
  8*60;

const DAY_END=
  22*60+30;

const PX_PER_MINUTE=
  2;


let menus=[];

let bookings=[];

let blockedTimes=[];

let openSlots=[];

let editingBooking=null;


/* ==========================
   共通
========================== */

function esc(value){

  return String(value??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");

}


function todayJapan(){

  const parts=
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:'Asia/Tokyo',
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }
    ).formatToParts(
      new Date()
    );


  const get=
    type=>
      parts.find(
        p=>p.type===type
      )?.value;


  return `${
    get('year')
  }-${
    get('month')
  }-${
    get('day')
  }`;

}


function addDays(
  date,
  amount
){

  const [y,m,d]=
    date
      .split('-')
      .map(Number);


  const value=
    new Date(
      Date.UTC(
        y,
        m-1,
        d
      )
    );


  value.setUTCDate(
    value.getUTCDate()
    +
    amount
  );


  return value
    .toISOString()
    .slice(
      0,
      10
    );

}


function formatDate(
  date
){

  if(!date){
    return '';
  }


  const [y,m,d]=
    date
      .split('-')
      .map(Number);


  return new Intl.DateTimeFormat(
    'ja-JP',
    {
      timeZone:'UTC',
      year:'numeric',
      month:'numeric',
      day:'numeric',
      weekday:'short'
    }
  ).format(
    new Date(
      Date.UTC(
        y,
        m-1,
        d
      )
    )
  );

}


function timeToMinutes(
  time
){

  const [h,m]=
    String(time)
      .slice(0,5)
      .split(':')
      .map(Number);


  return h*60+m;

}


function menuDuration(
  booking
){

  if(
    Number(
      booking.minutes
    )>0
  ){

    return Number(
      booking.minutes
    );

  }


  const menu=
    menus.find(
      item=>
        String(item.id)
        ===
        String(
          booking.menu_id
        )
    );


  return Number(
    menu?.minutes
    ||
    30
  );

}


/* ==========================
   認証
========================== */

async function syncAuth(){

  const {
    data:{session}
  }=
    await supabase.auth
      .getSession();


  $('loginCard')
    .classList
    .toggle(
      'hidden',
      !!session
    );


  $('adminArea')
    .classList
    .toggle(
      'hidden',
      !session
    );


  if(!session){
    return;
  }


  if(
    !$('date').value
  ){

    $('date').value=
      todayJapan();

  }


  await loadMenus();

  await loadDay();

}


$('login').onclick=
async()=>{

  const {error}=
    await supabase.auth
      .signInWithPassword({

        email:
          $('email')
            .value
            .trim(),

        password:
          $('password').value

      });


  if(error){

    $('loginMsg').textContent=
      'ログインできませんでした。';

    return;

  }


  $('loginMsg').textContent='';

  await syncAuth();

};


/* ==========================
   メニュー
========================== */

async function loadMenus(){

  const {data,error}=
    await supabase
      .from(
        'nakano_menus'
      )
      .select('*')
      .eq(
        'is_active',
        true
      )
      .order(
        'display_order'
      );


  if(error){

    console.error(error);

    return;

  }


  menus=
    data||[];


  $('editMenu').innerHTML=

    '<option value="">メニューを選択</option>'

    +

    menus.map(
      menu=>`

        <option value="${esc(menu.id)}">

          ${esc(menu.name)}
          ${Number(menu.price).toLocaleString()}円

        </option>

      `
    ).join('');

}


/* ==========================
   日付操作
========================== */

$('date').onchange=
async()=>{

  closeEdit();

  await loadDay();

};


$('today').onclick=
async()=>{

  $('date').value=
    todayJapan();

  closeEdit();

  await loadDay();

};


$('prevDay').onclick=
async()=>{

  $('date').value=
    addDays(
      $('date').value,
      -1
    );

  closeEdit();

  await loadDay();

};


$('nextDay').onclick=
async()=>{

  $('date').value=
    addDays(
      $('date').value,
      1
    );

  closeEdit();

  await loadDay();

};


/* ==========================
   データ取得
========================== */

async function loadDay(){

  const date=
    $('date').value;


  if(!date){
    return;
  }


  $('dateTitle').textContent=
    formatDate(
      date
    );


  $('scheduleMsg').textContent=
    '読み込んでいます…';


  const [
    bookingResult,
    blockedResult,
    slotResult
  ]=
    await Promise.all([

      supabase
        .from(
          'nakano_bookings'
        )
        .select('*')
        .eq(
          'booking_date',
          date
        )
        .eq(
          'status',
          'confirmed'
        )
        .order(
          'start_time'
        ),

      supabase
        .from(
          'nakano_blocked_times'
        )
        .select('*')
        .eq(
          'blocked_date',
          date
        )
        .order(
          'start_time'
        ),

      supabase
        .from(
          'nakano_open_slots'
        )
        .select('*')
        .eq(
          'slot_date',
          date
        )

    ]);


  if(
    bookingResult.error
    ||
    blockedResult.error
    ||
    slotResult.error
  ){

    console.error(
      bookingResult.error,
      blockedResult.error,
      slotResult.error
    );


    $('scheduleMsg').textContent=
      '予約情報を読み込めませんでした。';


    return;

  }


  bookings=
    bookingResult.data||[];


  blockedTimes=
    blockedResult.data||[];


  openSlots=
    slotResult.data||[];


  $('scheduleMsg').textContent='';


  renderTimeline();

  renderBookingList();

}


/* ==========================
   タイムライン
========================== */

function renderTimeHeader(){

  const box=
    $('timeHeader');


  box.innerHTML='';


  for(
    let minute=DAY_START;
    minute<=DAY_END;
    minute+=30
  ){

    const mark=
      document.createElement(
        'div'
      );


    mark.className=
      'timeMark';


    mark.style.left=
      `${
        (
          minute-DAY_START
        )
        *
        PX_PER_MINUTE
      }px`;


    mark.style.width=
      `${
        30
        *
        PX_PER_MINUTE
      }px`;


    mark.textContent=
      `${
        String(
          Math.floor(
            minute/60
          )
        ).padStart(
          2,
          '0'
        )
      }:${
        String(
          minute%60
        ).padStart(
          2,
          '0'
        )
      }`;


    box.appendChild(
      mark
    );

  }

}


function renderTimeline(){

  renderTimeHeader();


  const lane=
    $('lane');


  lane.innerHTML='';


  const slotMap=
    new Map(
      openSlots.map(
        row=>[
          String(
            row.start_time
          ),
          row
        ]
      )
    );


  for(
    let minute=DAY_START;
    minute<=DAY_END;
    minute+=30
  ){

    const time=
      `${
        String(
          Math.floor(
            minute/60
          )
        ).padStart(
          2,
          '0'
        )
      }:${
        String(
          minute%60
        ).padStart(
          2,
          '0'
        )
      }:00`;


    const slot=
      slotMap.get(
        time
      );


    const cell=
      document.createElement(
        'div'
      );


    cell.className=
      'slotBackground '
      +
      (
        slot?.is_open
        ?
        'slotOpen'
        :
        'slotClosed'
      );


    cell.style.left=
      `${
        (
          minute-DAY_START
        )
        *
        PX_PER_MINUTE
      }px`;


    cell.style.width=
      `${
        30
        *
        PX_PER_MINUTE
      }px`;


    lane.appendChild(
      cell
    );

  }


  blockedTimes.forEach(
    item=>{

      let start=
        timeToMinutes(
          item.start_time
        );


      let end=
        timeToMinutes(
          item.end_time
        );


      if(
        String(
          item.end_time
        ).startsWith(
          '23:59'
        )
      ){

        end=
          DAY_END+30;

      }


      start=
        Math.max(
          start,
          DAY_START
        );


      end=
        Math.min(
          end,
          DAY_END+30
        );


      if(
        end<=start
      ){
        return;
      }


      const block=
        document.createElement(
          'div'
        );


      block.className=
        'blockedBlock';


      block.style.left=
        `${
          (
            start-DAY_START
          )
          *
          PX_PER_MINUTE
        }px`;


      block.style.width=
        `${
          Math.max(
            38,
            (
              end-start
            )
            *
            PX_PER_MINUTE
          )
        }px`;


      block.innerHTML=`

        <strong>
          予約不可
        </strong>

        <br>

        ${esc(
          item.memo
          ||
          ''
        )}

      `;


      lane.appendChild(
        block
      );

    }
  );


  bookings.forEach(
    booking=>{

      const start=
        timeToMinutes(
          booking.start_time
        );


      const duration=
        menuDuration(
          booking
        );


      const block=
        document.createElement(
          'div'
        );


      block.className=
        'bookingBlock';


      block.style.left=
        `${
          (
            start-DAY_START
          )
          *
          PX_PER_MINUTE
        }px`;


      block.style.width=
        `${
          Math.max(
            74,
            duration
            *
            PX_PER_MINUTE
          )
        }px`;


      block.dataset.bookingId=
        booking.id;


      block.innerHTML=`

        <div class="bookingTime">

          ${esc(
            String(
              booking.start_time
            ).slice(
              0,
              5
            )
          )}

        </div>

        <div class="bookingName">

          ${esc(
            booking.customer_name
            ||
            ''
          )}

        </div>

        <div class="bookingMenu">

          ${esc(
            booking.menu_name
            ||
            ''
          )}

        </div>

      `;


      block.onclick=
      ()=>{

        openEdit(
          booking
        );

      };


      lane.appendChild(
        block
      );

    }
  );


  /*
    今日を開いた時は
    現在時刻付近まで自動で横スクロール
  */

  if(
    $('date').value
    ===
    todayJapan()
  ){

    const now=
      new Date();


    const parts=
      new Intl.DateTimeFormat(
        'en-US',
        {
          timeZone:'Asia/Tokyo',
          hour:'2-digit',
          minute:'2-digit',
          hourCycle:'h23'
        }
      ).formatToParts(
        now
      );


    const hour=
      Number(
        parts.find(
          p=>p.type==='hour'
        )?.value
        ||
        8
      );


    const minute=
      Number(
        parts.find(
          p=>p.type==='minute'
        )?.value
        ||
        0
      );


    const current=
      hour*60+minute;


    const left=
      Math.max(
        0,
        (
          current
          -
          DAY_START
          -
          60
        )
        *
        PX_PER_MINUTE
      );


    setTimeout(
      ()=>{

        $('timelineScroll')
          .scrollLeft=
            left;

      },
      50
    );

  }

}


/* ==========================

========================== */

    !bookings.length
  ){

    box.innerHTML=

    return;

  }


  box.innerHTML=
    bookings.map(

            <div>

              <div class="bookingItemTime">

                  ).slice(

                  )
                )}

              </div>

              <div class="bookingItemMenu">

                ${esc(
                  booking.menu_name

                  ''
                )}

            </div>

          </div>

            `

            `

          ${

              <div class="bookingItemMemo">

                  booking.memo

            `

          if(booking){

/* ==========================
   編集
========================== */

function openEdit(
  booking
){

  editingBooking=
    booking;


  $('editCard')
    .classList
    .remove(
      'hidden'
    );


  $('editingSummary').innerHTML=

    `<strong>${
      esc(
        String(
          booking.start_time
        ).slice(
          0,
          5
        )
      )
    }　${
      esc(
        booking.customer_name
        ||
        ''
      )
    }</strong><br>${
      esc(
        booking.menu_name
        ||
        ''
      )
    }`;


  $('editDate').value=
    booking.booking_date;


  $('editMenu').value=
    booking.menu_id;


  $('editName').value=
    booking.customer_name
    ||
    '';


  $('editPhone').value=
    booking.phone
    ||
    '';


  $('editMemo').value=
    booking.memo
    ||
    '';


  $('editMsg').textContent='';


  loadEditTimes();


  $('editCard')
    .scrollIntoView({
      behavior:'smooth',
      block:'start'
    });

}


function closeEdit(){

  editingBooking=
    null;


  $('editCard')
    .classList
    .add(
      'hidden'
    );

}


$('closeEdit').onclick=
  closeEdit;


$('editMenu').onchange=
  loadEditTimes;


$('editDate').onchange=
  loadEditTimes;


async function getAvailableTimes(
  menuId,
  date
){

  if(
    !menuId
    ||
    !date
  ){
    return [];
  }


  const {data,error}=
    await supabase.rpc(
      'nakano_available_slots',
      {
        p_date:
          date,

        p_menu_id:
          menuId
      }
    );


  if(error){

    console.error(error);

    return [];

  }


  return data||[];

}


async function loadEditTimes(){

  if(
    !editingBooking
  ){
    return;
  }


  const menuId=
    $('editMenu').value;


  const date=
    $('editDate').value;


  const select=
    $('editTime');


  select.innerHTML=
    '<option value="">時間を選択</option>';


  let data=
    await getAvailableTimes(
      menuId,
      date
    );


  const currentTime=
    String(
      editingBooking.start_time
    );


  const sameDate=
    date
    ===
    editingBooking.booking_date;


  const sameMenu=
    String(menuId)
    ===
    String(
      editingBooking.menu_id
    );


  if(
    sameDate
    &&
    sameMenu
    &&
    !data.some(
      slot=>
        String(
          slot.start_time
        )
        ===
        currentTime
    )
  ){

    data.push({
      start_time:
        currentTime
    });

  }


  data.sort(
    (a,b)=>
      String(
        a.start_time
      )
      .localeCompare(
        String(
          b.start_time
        )
      )
  );


  data.forEach(
    slot=>{

      const option=
        document.createElement(
          'option'
        );


      option.value=
        slot.start_time;


      option.textContent=
        String(
          slot.start_time
        ).slice(
          0,
          5
        );


      if(
        sameDate
        &&
        String(
          slot.start_time
        )
        ===
        currentTime
      ){

        option.selected=
          true;

      }


      select.appendChild(
        option
      );

    }
  );

}


/* ==========================
   保存
========================== */

$('saveEdit').onclick=
async()=>{

  if(
    !editingBooking
  ){
    return;
  }


  const payload={

    p_booking_id:
      editingBooking.id,

    p_date:
      $('editDate').value,

    p_start_time:
      $('editTime').value,

    p_menu_id:
      $('editMenu').value,

    p_customer_name:
      $('editName')
        .value
        .trim(),

    p_phone:
      $('editPhone')
        .value
        .trim(),

    p_memo:
      $('editMemo')
        .value
        .trim()
      ||
      null

  };


  if(
    !payload.p_date
    ||
    !payload.p_start_time
    ||
    !payload.p_menu_id
    ||
    !payload.p_customer_name
    ||
    !payload.p_phone
  ){

    $('editMsg').textContent=
      '日付・時間・メニュー・お名前・電話番号を確認してください。';

    return;

  }


  $('saveEdit').disabled=
    true;


  $('saveEdit').textContent=
    '変更しています…';


  const {error}=
    await supabase.rpc(
      'nakano_admin_change_booking',
      payload
    );


  $('saveEdit').disabled=
    false;


  $('saveEdit').textContent=
    '変更を保存';


  if(error){

    console.error(error);


    $('editMsg').textContent=
      '変更できませんでした。空き時間を確認してください。';


    return;

  }


  $('date').value=
    payload.p_date;


  closeEdit();


  await loadDay();

};


/* ==========================
   キャンセル
========================== */

$('cancelBooking').onclick=
async()=>{

  if(
    !editingBooking
  ){
    return;
  }


  if(
    !confirm(
      `${String(
        editingBooking.start_time
      ).slice(
        0,
        5
      )} ${editingBooking.customer_name} 様の予約をキャンセルしますか？`
    )
  ){
    return;
  }


  const {error}=
    await supabase.rpc(
      'nakano_admin_cancel_booking',
      {
        p_booking_id:
          editingBooking.id
      }
    );


  if(error){

    console.error(error);


    $('editMsg').textContent=
      'キャンセルできませんでした。';


    return;

  }


  closeEdit();


  await loadDay();

};


/* ==========================
   起動
========================== */

supabase.auth
  .onAuthStateChange(
    ()=>syncAuth()
  );


syncAuth();

</script>
