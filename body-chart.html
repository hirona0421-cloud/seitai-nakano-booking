<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>整体なかの｜身体の状態</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f3ee}
#chartFrame{display:block;width:100%;height:100%;border:0;background:#f6f3ee}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;color:#77716a;background:#f6f3ee;font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;z-index:2;text-align:center}
#boot.hidden{display:none}
</style>
</head>
<body>
<div id="boot">身体図を読み込んでいます…</div>
<iframe id="chartFrame" title="身体の状態"></iframe>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL='https://scjzofjyxmchfjsngqtb.supabase.co';
const SUPABASE_KEY='sb_publishable_EGlr-6w0xh4gD8OImboE_Q_V-COJ7t9';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);

const params=new URLSearchParams(location.search);
const customer=params.get('customer')||'draft';
const date=params.get('date')||'undated';
const KEY=`nakano_body_chart_${customer}_${date}`;
const CLOUD_TABLE='nakano_body_charts';
const frame=document.getElementById('chartFrame');
const boot=document.getElementById('boot');

let cloudDisabled=false;

function legacyUrl(){
  const u=new URL('./body-chart-legacy.html',location.href);
  for(const [k,v] of params.entries())u.searchParams.set(k,v);
  return u.href;
}

function localData(){
  try{return localStorage.getItem(KEY)||''}catch{return''}
}

function setLocalData(v){
  if(!v)return;
  try{localStorage.setItem(KEY,v)}catch{}
}

function setLegacyMessage(text){
  try{
    const el=frame.contentDocument?.getElementById('msg');
    if(el)el.textContent=text;
  }catch{}
}

async function sessionExists(){
  try{
    const {data:{session}}=await supabase.auth.getSession();
    return !!session;
  }catch{
    return false;
  }
}

async function fetchCloud(){
  if(customer==='draft'||date==='undated')return null;
  try{
    const {data,error}=await supabase
      .from(CLOUD_TABLE)
      .select('image_data,updated_at')
      .eq('customer_id',customer)
      .eq('visit_date',date)
      .maybeSingle();
    if(error){
      cloudDisabled=true;
      console.warn('Body chart cloud read unavailable:',error.message);
      return null;
    }
    return data||null;
  }catch(e){
    cloudDisabled=true;
    console.warn('Body chart cloud read failed:',e);
    return null;
  }
}

async function saveCloud(imageData,{migration=false}={}){
  if(!imageData||cloudDisabled||customer==='draft'||date==='undated')return false;
  try{
    const {data:{user}}=await supabase.auth.getUser();
    if(!user)return false;
    const {error}=await supabase.from(CLOUD_TABLE).upsert({
      customer_id:customer,
      visit_date:date,
      image_data:imageData,
      updated_at:new Date().toISOString(),
      updated_by:user.id
    },{onConflict:'customer_id,visit_date'});
    if(error){
      cloudDisabled=true;
      console.warn('Body chart cloud save unavailable:',error.message);
      return false;
    }
    if(!migration)setLegacyMessage('身体図をクラウドにも保存しました。');
    return true;
  }catch(e){
    cloudDisabled=true;
    console.warn('Body chart cloud save failed:',e);
    return false;
  }
}

async function syncAfterSave(){
  await new Promise(r=>setTimeout(r,20));
  const v=localData();
  if(!v)return;
  await saveCloud(v);
}

function hookLegacy(){
  boot.classList.add('hidden');
  try{
    const doc=frame.contentDocument;
    const save=doc?.getElementById('save');
    if(save)save.addEventListener('click',()=>{syncAfterSave()});
  }catch(e){
    console.warn('Body chart sync hook failed:',e);
  }
}

async function start(){
  const hasSession=await sessionExists();
  let cloud=null;
  const local=localData();

  if(hasSession)cloud=await fetchCloud();

  if(cloud?.image_data){
    setLocalData(cloud.image_data);
  }

  frame.addEventListener('load',async()=>{
    hookLegacy();
    if(hasSession&&!cloud?.image_data&&local&&!cloudDisabled){
      const migrated=await saveCloud(local,{migration:true});
      if(migrated)setLegacyMessage('この端末に保存されていた身体図をクラウドへ引き継ぎました。');
    }
  },{once:true});

  frame.src=legacyUrl();
}

start();
</script>
</body>
</html>
