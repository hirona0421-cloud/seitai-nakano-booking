const base=document.getElementById('base');base.src=BASE;
const canvas=document.getElementById('draw'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');let color='#d9413a',erase=false,drawing=false,last=null,historyStack=[];
function resize(){const old=canvas.width?canvas.toDataURL():null;const r=stage.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);ctx.lineCap='round';ctx.lineJoin='round';if(old){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=old}else load();}
function load(){const s=localStorage.getItem(KEY);if(!s)return;const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,stage.clientWidth,stage.clientHeight);im.src=s}
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function snapshot(){historyStack.push(canvas.toDataURL());if(historyStack.length>20)historyStack.shift()}
function start(e){e.preventDefault();snapshot();drawing=true;last=pos(e);try{canvas.setPointerCapture(e.pointerId)}catch{}}
function move(e){if(!drawing)return;e.preventDefault();const p=pos(e);ctx.globalCompositeOperation=erase?'destination-out':'source-over';ctx.strokeStyle=color;ctx.lineWidth=erase?24:4;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}
function end(){drawing=false;last=null}
canvas.addEventListener('pointerdown',start);canvas.addEventListener('pointermove',move);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
document.querySelectorAll('.color').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;document.querySelectorAll('.color').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('eraser').classList.remove('primary')});
document.getElementById('eraser').onclick=e=>{erase=!erase;e.currentTarget.classList.toggle('primary',erase)};
document.getElementById('clear').onclick=()=>{if(!confirm('身体図の書き込みを全部消しますか？'))return;snapshot();ctx.clearRect(0,0,canvas.width,canvas.height)};
document.getElementById('undo').onclick=()=>{const s=historyStack.pop();if(!s)return;const im=new Image();im.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,stage.clientWidth,stage.clientHeight)};im.src=s};
document.getElementById('save').onclick=()=>{localStorage.setItem(KEY,canvas.toDataURL('image/png'));document.getElementById('msg').textContent='身体図を保存しました。';};
document.getElementById('close').onclick=()=>history.back();
document.getElementById('fullscreen').onclick=async()=>{if(!document.fullscreenElement){try{await stage.requestFullscreen()}catch(e){document.body.classList.add('chartOnly')}}else{try{await document.exitFullscreen()}catch{document.body.classList.remove('chartOnly')}}};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('chartOnly')});window.addEventListener('resize',()=>setTimeout(resize,80));resize();
</script></body></html>
