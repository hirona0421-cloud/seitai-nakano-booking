<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>整体なかの｜身体の状態</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3ee;color:#2f2d2a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif}.wrap{max-width:980px;margin:auto;padding:12px}.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}.bar h1{font-size:20px;margin:0}.btn{border:1px solid #d8d0c7;background:#fff;color:#4d4843;border-radius:12px;padding:10px 12px;font-weight:700}.primary{background:#61574d;color:#fff;border-color:#61574d}.card{background:#fff;border:1px solid #e7e0d7;border-radius:18px;padding:12px}.meta{font-size:13px;color:#77716a;margin:0 0 8px}.stage{position:relative;width:100%;aspect-ratio:1.1/1;min-height:560px;background:#fff;border:1px solid #eee7df;border-radius:14px;overflow:hidden;touch-action:none}#baseSvg,#draw{position:absolute;inset:0;width:100%;height:100%}#baseSvg{pointer-events:none}#draw{touch-action:none}.tools,.labels{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}.toolTitle{font-size:12px;color:#77716a;width:100%;margin-top:4px}.color{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d8d0c7}.color.active{box-shadow:0 0 0 3px #61574d}.red{background:#d9413a}.blue{background:#3478d4}.green{background:#4a9d55}.purple{background:#8a55b5}.orange{background:#e68a28}.black{background:#333}.labelBtn{border:1px solid #ded6ce;background:#fff;border-radius:10px;padding:9px 14px;font-weight:700}.labelBtn[data-label="痛み"]{color:#c93630}.labelBtn[data-label="こり"]{color:#398346}.labelBtn[data-label="しびれ"]{color:#7548a0}.labelBtn[data-label="むくみ"]{color:#2e68b9}.labelBtn.active{box-shadow:0 0 0 2px #61574d inset;background:#faf8f5}.hint{font-size:13px;color:#77716a;line-height:1.6;margin:8px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}@media(max-width:600px){.wrap{padding:8px}.stage{aspect-ratio:1.02/1;min-height:610px}.bar h1{font-size:18px}.btn{padding:9px 10px}.card{padding:8px}}</style></head><body><div class="wrap"><div class="bar"><button class="btn" onclick="history.back()">← 戻る</button><h1>身体の状態</h1><button class="btn" id="fullscreen">拡大</button></div><div class="card"><p id="meta" class="meta"></p><p class="hint">図に直接書き込めます。「痛み・こり・しびれ・むくみ」を押してから図をタップすると文字を置けます。</p><div class="stage" id="stage"><svg id="baseSvg" viewBox="0 0 760 690" preserveAspectRatio="xMidYMid meet" aria-label="身体図 正面・背面"><g fill="none" stroke="#222" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(74 24)"><ellipse cx="145" cy="63" rx="38" ry="49"/><path d="M119 99 L116 121 M171 99 L174 121 M116 121 C99 129 81 138 69 153 M174 121 C191 129 209 138 221 153 M69 153 C61 185 52 220 43 252 M221 153 C229 185 238 220 247 252 M43 252 C38 270 31 291 25 310 M247 252 C252 270 259 291 265 310"/><path d="M25 310 C19 319 14 328 11 340 M25 310 C23 326 22 339 23 352 M25 310 C30 327 34 340 38 350 M265 310 C271 319 276 328 279 340 M265 310 C267 326 268 339 267 352 M265 310 C260 327 256 340 252 350"/><path d="M69 153 C76 209 88 258 101 300 M221 153 C214 209 202 258 189 300 M101 300 C106 317 110 332 110 349 M189 300 C184 317 180 332 180 349 M110 349 C107 390 105 430 104 469 M180 349 C183 390 185 430 186 469 M104 469 C100 508 98 548 99 587 M186 469 C190 508 192 548 191 587 M99 587 C96 604 94 617 89 625 M191 587 C194 604 196 617 201 625"/><path d="M110 349 C124 344 136 341 145 341 C154 341 166 344 180 349 M145 341 L145 379 M99 587 C106 593 115 595 124 593 M191 587 C184 593 175 595 166 593"/><path d="M89 625 C96 632 110 635 124 630 M201 625 C194 632 180 635 166 630"/><path d="M105 151 C116 162 129 168 145 168 C161 168 174 162 185 151 M104 469 C116 465 126 466 134 471 M186 469 C174 465 164 466 156 471"/></g><g transform="translate(426 24)"><ellipse cx="145" cy="63" rx="38" ry="49"/><path d="M119 99 L116 121 M171 99 L174 121 M116 121 C99 129 81 138 69 153 M174 121 C191 129 209 138 221 153 M69 153 C61 185 52 220 43 252 M221 153 C229 185 238 220 247 252 M43 252 C38 270 31 291 25 310 M247 252 C252 270 259 291 265 310"/><path d="M25 310 C19 319 14 328 11 340 M25 310 C23 326 22 339 23 352 M25 310 C30 327 34 340 38 350 M265 310 C271 319 276 328 279 340 M265 310 C267 326 268 339 267 352 M265 310 C260 327 256 340 252 350"/><path d="M69 153 C76 209 88 258 101 300 M221 153 C214 209 202 258 189 300 M101 300 C106 317 110 332 110 349 M189 300 C184 317 180 332 180 349 M110 349 C107 390 105 430 104 469 M180 349 C183 390 185 430 186 469 M104 469 C100 508 98 548 99 587 M186 469 C190 508 192 548 191 587 M99 587 C96 604 94 617 89 625 M191 587 C194 604 196 617 201 625"/><path d="M110 349 C122 338 133 334 145 334 C157 334 168 338 180 349 M145 334 L145 379 M99 587 C106 593 115 595 124 593 M191 587 C184 593 175 595 166 593 M89 625 C96 632 110 635 124 630 M201 625 C194 632 180 635 166 630"/><path d="M103 147 C116 136 129 132 145 132 C161 132 174 136 187 147 M116 151 C124 173 134 185 145 190 C156 185 166 173 174 151 M105 300 C117 312 130 318 145 318 C160 318 173 312 185 300"/></g></g><text x="219" y="677" text-anchor="middle" fill="#777" font-size="18">正面</text><text x="571" y="677" text-anchor="middle" fill="#777" font-size="18">背面</text></svg><canvas id="draw"></canvas></div><div class="toolTitle">症状テキスト</div><div class="labels"><button class="labelBtn" data-label="痛み" data-color="#d9413a">痛み</button><button class="labelBtn" data-label="こり" data-color="#4a9d55">こり</button><button class="labelBtn" data-label="しびれ" data-color="#8a55b5">しびれ</button><button class="labelBtn" data-label="むくみ" data-color="#3478d4">むくみ</button></div><div class="toolTitle">ペン</div><div class="tools"><button class="color red active" data-c="#d9413a" aria-label="赤"></button><button class="color blue" data-c="#3478d4" aria-label="青"></button><button class="color green" data-c="#4a9d55" aria-label="緑"></button><button class="color purple" data-c="#8a55b5" aria-label="紫"></button><button class="color orange" data-c="#e68a28" aria-label="橙"></button><button class="color black" data-c="#333333" aria-label="黒"></button><button class="btn" id="eraser">消しゴム</button><button class="btn" id="undo">元に戻す</button><button class="btn" id="clear">全消去</button></div><div class="actions"><button class="btn" id="close">閉じる</button><button class="btn primary" id="save">保存</button></div><div id="msg" class="hint"></div></div></div><script>const params=new URLSearchParams(location.search),customer=params.get('customer')||'draft',date=params.get('date')||'undated',name=params.get('name')||'';const KEY=`nakano_body_chart_${customer}_${date}`;document.getElementById('meta').textContent=[name,date&&date!=='undated'?date:''].filter(Boolean).join('　');const canvas=document.getElementById('draw'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');let color='#d9413a',erase=false,drawing=false,last=null,historyStack=[],labelMode=null,labelColor='#333';function resize(){const old=canvas.width?canvas.toDataURL():null;const r=stage.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);ctx.lineCap='round';ctx.lineJoin='round';if(old){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=old}else load()}function load(){const s=localStorage.getItem(KEY);if(!s)return;const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,stage.clientWidth,stage.clientHeight);im.src=s}function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function snapshot(){historyStack.push(canvas.toDataURL());if(historyStack.length>20)historyStack.shift()}function start(e){e.preventDefault();const p=pos(e);if(labelMode){snapshot();ctx.globalCompositeOperation='source-over';ctx.fillStyle=labelColor;ctx.font='700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif';ctx.fillText(labelMode,p.x,p.y);labelMode=null;document.querySelectorAll('.labelBtn').forEach(x=>x.classList.remove('active'));return}snapshot();drawing=true;last=p}function move(e){if(!drawing)return;e.preventDefault();const p=pos(e);ctx.globalCompositeOperation=erase?'destination-out':'source-over';ctx.strokeStyle=color;ctx.lineWidth=erase?26:4;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}function end(){drawing=false;last=null}canvas.addEventListener('pointerdown',start);canvas.addEventListener('pointermove',move);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);document.querySelectorAll('.labelBtn').forEach(b=>b.onclick=()=>{labelMode=b.dataset.label;labelColor=b.dataset.color;erase=false;document.getElementById('eraser').classList.remove('primary');document.querySelectorAll('.labelBtn').forEach(x=>x.classList.toggle('active',x===b))});document.querySelectorAll('.color').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;labelMode=null;document.querySelectorAll('.labelBtn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.color').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('eraser').classList.remove('primary')});document.getElementById('eraser').onclick=e=>{erase=!erase;labelMode=null;document.querySelectorAll('.labelBtn').forEach(x=>x.classList.remove('active'));e.currentTarget.classList.toggle('primary',erase)};document.getElementById('clear').onclick=()=>{snapshot();ctx.clearRect(0,0,stage.clientWidth,stage.clientHeight)};document.getElementById('undo').onclick=()=>{const s=historyStack.pop();if(!s)return;const im=new Image();im.onload=()=>{ctx.clearRect(0,0,stage.clientWidth,stage.clientHeight);ctx.drawImage(im,0,0,stage.clientWidth,stage.clientHeight)};im.src=s};document.getElementById('save').onclick=()=>{localStorage.setItem(KEY,canvas.toDataURL('image/png'));document.getElementById('msg').textContent='身体図を保存しました。'};document.getElementById('close').onclick=()=>history.back();document.getElementById('fullscreen').onclick=async()=>{if(!document.fullscreenElement){try{await stage.requestFullscreen()}catch(e){stage.scrollIntoView({behavior:'smooth',block:'center'})}}else document.exitFullscreen()};window.addEventListener('resize',()=>setTimeout(resize,100));resize();</script></body></html>
