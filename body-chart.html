<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>整体なかの｜身体の状態</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3ee;color:#2f2d2a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif}.wrap{max-width:900px;margin:auto;padding:14px}.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}.bar h1{font-size:20px;margin:0}.btn{border:1px solid #d8d0c7;background:#fff;color:#4d4843;border-radius:12px;padding:10px 12px;font-weight:700}.primary{background:#61574d;color:#fff;border-color:#61574d}.card{background:#fff;border:1px solid #e7e0d7;border-radius:18px;padding:12px}.meta{font-size:13px;color:#77716a;margin:0 0 8px}.stage{position:relative;width:100%;aspect-ratio:4/3;min-height:430px;background:#fff;border:1px solid #eee7df;border-radius:14px;overflow:hidden;touch-action:none}#base,#draw{position:absolute;inset:0;width:100%;height:100%}#base{object-fit:contain;padding:10px;pointer-events:none}#draw{touch-action:none}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}.color{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d8d0c7}.color.active{box-shadow:0 0 0 3px #61574d}.red{background:#d9413a}.blue{background:#3478d4}.green{background:#4a9d55}.purple{background:#8a55b5}.orange{background:#e68a28}.black{background:#333}.hint{font-size:13px;color:#77716a;line-height:1.6;margin:8px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}@media(max-width:600px){.stage{aspect-ratio:3/4;min-height:520px}.bar h1{font-size:18px}.btn{padding:9px 10px}}</style></head><body><div class="wrap"><div class="bar"><button class="btn" onclick="history.back()">← 戻る</button><h1>身体の状態</h1><button class="btn" id="fullscreen">拡大</button></div><div class="card"><p id="meta" class="meta"></p><p class="hint">図に直接書き込めます。お客様への説明では「拡大」を押すと図だけ大きく表示できます。</p><div class="stage" id="stage"><img id="base" alt="身体図"><canvas id="draw"></canvas></div><div class="tools"><button class="color red active" data-c="#d9413a" aria-label="赤"></button><button class="color blue" data-c="#3478d4" aria-label="青"></button><button class="color green" data-c="#4a9d55" aria-label="緑"></button><button class="color purple" data-c="#8a55b5" aria-label="紫"></button><button class="color orange" data-c="#e68a28" aria-label="橙"></button><button class="color black" data-c="#333333" aria-label="黒"></button><button class="btn" id="eraser">消しゴム</button><button class="btn" id="undo">元に戻す</button><button class="btn" id="clear">全消去</button></div><div class="actions"><button class="btn" id="close">閉じる</button><button class="btn primary" id="save">保存</button></div><div id="msg" class="hint"></div></div></div><script>
const params=new URLSearchParams(location.search),customer=params.get('customer')||'draft',date=params.get('date')||'undated',name=params.get('name')||'';const KEY=`nakano_body_chart_${customer}_${date}`;document.getElementById('meta').textContent=[name,date&&date!=='undated'?date:''].filter(Boolean).join('　');
const base=document.getElementById('base');base.src='./body-chart-base.png';base.onerror=()=>{document.getElementById('msg').textContent='身体図画像を準備中です。';};
const canvas=document.getElementById('draw'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');let color='#d9413a',erase=false,drawing=false,last=null,historyStack=[];
function resize(){const old=canvas.width?canvas.toDataURL():null;const r=stage.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);ctx.lineCap='round';ctx.lineJoin='round';if(old){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=old}else load();}
function load(){const s=localStorage.getItem(KEY);if(!s)return;const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,stage.clientWidth,stage.clientHeight);im.src=s}
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function snapshot(){historyStack.push(canvas.toDataURL());if(historyStack.length>20)historyStack.shift()}
function start(e){e.preventDefault();snapshot();drawing=true;last=pos(e)}function move(e){if(!drawing)return;e.preventDefault();const p=pos(e);ctx.globalCompositeOperation=erase?'destination-out':'source-over';ctx.strokeStyle=color;ctx.lineWidth=erase?24:4;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}function end(){drawing=false;last=null}
canvas.addEventListener('pointerdown',start);canvas.addEventListener('pointermove',move);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
document.querySelectorAll('.color').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;document.querySelectorAll('.color').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('eraser').classList.remove('primary')});
document.getElementById('eraser').onclick=e=>{erase=!erase;e.currentTarget.classList.toggle('primary',erase)};document.getElementById('clear').onclick=()=>{snapshot();ctx.clearRect(0,0,canvas.width,canvas.height)};document.getElementById('undo').onclick=()=>{const s=historyStack.pop();if(!s)return;const im=new Image();im.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,stage.clientWidth,stage.clientHeight)};im.src=s};document.getElementById('save').onclick=()=>{localStorage.setItem(KEY,canvas.toDataURL('image/png'));document.getElementById('msg').textContent='身体図を保存しました。';};document.getElementById('close').onclick=()=>history.back();document.getElementById('fullscreen').onclick=async()=>{if(!document.fullscreenElement){try{await stage.requestFullscreen()}catch(e){stage.scrollIntoView({behavior:'smooth',block:'center'})}}else document.exitFullscreen()};window.addEventListener('resize',()=>setTimeout(resize,80));resize();
</script></body></html>
